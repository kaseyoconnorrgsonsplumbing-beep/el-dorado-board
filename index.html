        this.logEvent("note_add","Added a note on “"+this.modal.name+"”",App.areaS()+" "+arRoom.number);
        this.render(); break;

      /* photos */
      case "delphoto":
        if(!room) break;
        var uDp=this.requireEdit(); if(!uDp) break;
        var pid=t.getAttribute("data-pid");
        var ph=(room.photos||[]).filter(function(x){return x.id===pid;})[0];
        if(ph && !this.canRemove(uDp, ph.byId)){ this.toast("Only the office or the person who added it can delete."); break; }
        room.photos=(room.photos||[]).filter(function(x){return x.id!==pid;});
        Store.saveRoom(room); this.logEvent("photo_del","Deleted a photo",App.areaS()+" "+room.number); this.render(); break;

      /* notes */
      case "addnote":
        if(!room) break;
        var uAn=this.requireEdit(); if(!uAn) break;
        var ni=el("noteInput"); var txt=ni?ni.value.trim():"";
        if(!txt) break;
        var newNoteId=uid("n");
        room.notes=room.notes||[];
        room.notes.push({id:newNoteId,text:txt,byId:uAn.id,byName:uAn.name,byCompany:uAn.company||"",ts:Date.now(),
          critical:false, status:"", reply:"", replyBy:"", issuePhotos:[], fixPhotos:[],
          when:new Date().toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})});
        Store.saveRoom(room);
        this.logEvent("note_add", "Added a note: “"+txt.slice(0,60)+(txt.length>60?"…":"")+'”', App.areaS()+" "+room.number);
        this.render(); break;
      case "delnote":
        if(!room) break;
        var uDn=this.requireEdit(); if(!uDn) break;
        var nid=t.getAttribute("data-nid");
        var nt=(room.notes||[]).filter(function(x){return x.id===nid;})[0];
        if(nt && !this.canRemove(uDn, nt.byId)){ this.toast("Only the office or the author can delete."); break; }
        room.notes=(room.notes||[]).filter(function(x){return x.id!==nid;});
        Store.saveRoom(room); this.logEvent("note_del","Deleted a note",App.areaS()+" "+room.number); this.render(); break;

      /* schedule */
      case "savesch":
        if(!room) break;
        if(!this.requireEdit()) break;
        room.schedule=room.schedule||{};
        room.schedule.start=el("schStart").value; room.schedule.target=el("schTarget").value;
        Store.saveRoom(room); this.toast("Dates saved"); break;
      case "addms":
        if(!room) break;
        if(!this.requireEdit()) break;
        var ml=el("msLabel").value.trim(), md=el("msDate").value;
        if(!ml) break;
        room.schedule=room.schedule||{}; room.schedule.items=room.schedule.items||[];
        room.schedule.items.push({id:uid("m"),label:ml,date:md,done:false});
        Store.saveRoom(room); this.render(); break;
      case "togglems":
        if(!room) break;
        if(!this.requireEdit()) break;
        var mid=t.getAttribute("data-mid");
        (room.schedule.items||[]).forEach(function(m){ if(m.id===mid) m.done=!m.done; });
        Store.saveRoom(room); this.render(); break;
      case "delms":
        if(!room) break;
        if(!this.requireEdit()) break;
        var mid2=t.getAttribute("data-mid");
        room.schedule.items=(room.schedule.items||[]).filter(function(m){return m.id!==mid2;});
        Store.saveRoom(room); this.render(); break;

      /* config: rooms */
      case "addroom":
        var num=el("newRoomNum").value.trim(); var ada=el("newRoomAda").checked;
        if(!num) break;
        var order=this.roomList().length;
        var nr={id:uid("r"),number:num,ada:ada,order:order,projectId:this.projectId,done:{},photos:[],notes:[],schedule:{start:"",target:"",items:[]}};
        Store.saveRoom(nr);
        this.logEvent("room_add","Added "+this.areaS()+" "+num+(ada?" (ADA)":""));
        el("newRoomNum").value=""; el("newRoomAda").checked=false;
        // wait a tick for local echo, then re-render config counts
        setTimeout(function(){ App.render(); }, 30); break;
      case "addrooms":
        var bulkEl=el("bulkRoomNums"); var raw=bulkEl?bulkEl.value:"";
        var bAda=el("bulkRoomAda")?el("bulkRoomAda").checked:false;
        // split on commas, newlines, tabs, or semicolons (spreadsheet paste)
        var parts=raw.split(/[\n\r,;\t]+/).map(function(s){return s.trim();}).filter(function(s){return s.length;});
        // de-dupe within the paste (case-insensitive), keep first spelling
        var seenP={}, list=[];
        parts.forEach(function(s){ var k=s.toLowerCase(); if(!seenP[k]){ seenP[k]=1; list.push(s); } });
        if(!list.length){ this.toast("Nothing to add — paste some "+this.areaP().toLowerCase()); break; }
        // skip numbers that already exist in this project
        var existing={}; this.roomList().forEach(function(r){ existing[String(r.number).toLowerCase()]=1; });
        var order=this.roomList().length, added=0, skipped=0;
        list.forEach(function(num){
          if(existing[num.toLowerCase()]){ skipped++; return; }
          var nr={id:uid("r"),number:num,ada:bAda,order:order++,projectId:App.projectId,done:{},photos:[],notes:[],schedule:{start:"",target:"",items:[]}};
          Store.saveRoom(nr); added++;
        });
        if(added) this.logEvent("room_add","Added "+added+" "+(added===1?this.areaS():this.areaP())+" in bulk"+(bAda?" (ADA)":""));
        if(bulkEl) bulkEl.value=""; if(el("bulkRoomAda")) el("bulkRoomAda").checked=false;
        this.toast("Added "+added+(skipped?", skipped "+skipped+" already there":""));
        setTimeout(function(){ App.render(); }, 40); break;
      case "toggleada":
        var rid2=t.getAttribute("data-room"); var rr=this.rooms[rid2];
        if(rr){ rr.ada=t.checked; Store.saveRoom(rr); } break;
      case "delroom":
        var rid3=t.getAttribute("data-room"); var rr3=this.rooms[rid3];
        if(rr3 && confirm("Remove "+this.areaS()+" "+rr3.number+"? Its progress, photos and notes will be deleted.")){
          this.logEvent("room_del","Removed "+this.areaS()+" "+rr3.number);
          Store.deleteRoom(rid3); setTimeout(function(){ App.render(); },30);
        } break;

      /* config: template (edit draft, save on button) */
      case "addtask":
        this.cfgDraft.template.push({id:uid("t"),name:"New task",subs:[]}); this.render(); break;
      case "deltask":
        var dtI=+t.getAttribute("data-ti"); var dtT=this.cfgDraft.template[dtI];
        if(dtT && !confirm("Remove task “"+dtT.name+"” and its subtasks from the template? Progress shown for it disappears everywhere once you save.")) break;
        this.cfgDraft.template.splice(dtI,1); this.render(); break;
      case "taskup":
        var ti=+t.getAttribute("data-ti"); if(ti>0){ var arr=this.cfgDraft.template; var x=arr.splice(ti,1)[0]; arr.splice(ti-1,0,x);} this.render(); break;
      case "cleartaskdl":
        this._commitDraftInputs();
        var cdI=+t.getAttribute("data-ti"); if(this.cfgDraft.template[cdI]) this.cfgDraft.template[cdI].deadline="";
        this.render(); break;
      case "addsub":
        this.cfgDraft.template[+t.getAttribute("data-ti")].subs.push({id:uid("s"),name:"New subtask"}); this.render(); break;
      case "delsub":
        var dsI=+t.getAttribute("data-ti"), dsJ=+t.getAttribute("data-si");
        var dsS=this.cfgDraft.template[dsI]&&this.cfgDraft.template[dsI].subs[dsJ];
        if(dsS && !confirm("Remove subtask “"+dsS.name+"” from the template?")) break;
        this.cfgDraft.template[dsI].subs.splice(dsJ,1); this.render(); break;
      case "subup":
        this._commitDraftInputs();
        var suTi=+t.getAttribute("data-ti"), suSi=+t.getAttribute("data-si"), suArr=this.cfgDraft.template[suTi].subs;
        if(suSi>0){ var suX=suArr.splice(suSi,1)[0]; suArr.splice(suSi-1,0,suX); }
        this.render(); break;
      case "subdown":
        this._commitDraftInputs();
        var sdTi=+t.getAttribute("data-ti"), sdSi=+t.getAttribute("data-si"), sdArr=this.cfgDraft.template[sdTi].subs;
        if(sdSi<sdArr.length-1){ var sdX=sdArr.splice(sdSi,1)[0]; sdArr.splice(sdSi+1,0,sdX); }
        this.render(); break;
      case "savetemplate":
        this._commitDraftInputs();
        this.config = JSON.parse(JSON.stringify(this.cfgDraft));
        Store.saveProject(this.config).then(function(){ App.logEvent("config","Updated job info & task template"); App.toast("Saved"); });
        break;

      /* admin: users */
      case "saveadmin":
        var an=el("adminName").value.trim(), ap=el("adminPin").value.trim();
        if(ap && !validPw(ap)){ this.toast("Admin password must be at least 4 characters"); break; }
        if(ap && this.userByPin(ap)){ this.toast("That password is used by a worker — pick another"); break; }
        this._commitDraftInputs();
        this.cfgDraft.admin={pin:ap,name:an};
        this.config = JSON.parse(JSON.stringify(this.cfgDraft));
        // if we just set the admin password and aren't admin yet, sign in as admin on this device
        if(ap && !this.isAdmin()) this.setSession({id:"admin",name:an||"Office",company:"Office",role:"admin"});
        Store.saveProject(this.config).then(function(){ App.logEvent("config","Updated admin settings"); App.toast("Admin password saved"); App.render(); });
        break;
      case "approveuser":
        var au=this.users[t.getAttribute("data-uid")];
        if(au){ au.status="approved"; au.approvedTs=Date.now(); Store.saveUser(au); this.logEvent("user_approve","Approved login for "+au.name+(au.company?" ("+au.company+")":"")); this.toast(au.name+" approved"); setTimeout(function(){App.render();},30); }
        break;
      case "denyuser":
        var du=this.users[t.getAttribute("data-uid")];
        if(du && confirm("Deny and remove "+du.name+"’s request?")){ this.logEvent("user_deny","Denied access request from "+du.name); Store.deleteUser(du.id); setTimeout(function(){App.render();},30); }
        break;
      case "removeuser":
        var ru=this.users[t.getAttribute("data-uid")];
        if(ru && confirm("Remove "+ru.name+"? They’ll be signed out and need to request access again.")){ this.logEvent("user_remove","Removed user "+ru.name); Store.deleteUser(ru.id); setTimeout(function(){App.render();},30); }
        break;
      case "togglerole":
        if(!this.isAdmin()) break;
        var tru=this.users[t.getAttribute("data-uid")];
        if(tru){ tru.role=(tru.role==="pm"?"field":"pm"); Store.saveUser(tru); this.logEvent("user_role","Set "+tru.name+" to "+(tru.role==="pm"?"Project Manager":"Worker")); this.toast(tru.name+" is now "+(tru.role==="pm"?"Project Manager":"Worker")); setTimeout(function(){App.render();},30); }
        break;
      case "edituser":
        var eu=this.users[t.getAttribute("data-uid")];
        if(eu && this.isAdmin()){ this.modal={type:"edituser", uid:eu.id, role:(eu.role==="pm"?"pm":"field"), msg:null}; this.render(); }
        break;
      case "saveuser":
        this.doSaveUser(); break;
      case "adduser":
        if(this.isAdmin()){ this.modal={type:"adduser", role:"field", msg:null}; this.render(); } break;
      case "saveadduser":
        this.doAddUser(); break;
      case "setrole":
        if(this.modal){
          var gv2=function(id){ var e2=el(id); return e2?e2.value:""; };
          if(this.modal.type==="adduser") this.modal.f={name:gv2("auName"),company:gv2("auCompany"),pass:gv2("auPass")};
          else if(this.modal.type==="edituser") this.modal.f={name:gv2("euName"),company:gv2("euCompany"),pass:gv2("euPass")};
          this.modal.role=t.getAttribute("data-r"); this.render();
        } break;

      /* critical note management (admin) */
      case "managecrit":
        this.openCrit(t.getAttribute("data-room"), t.getAttribute("data-nid")); break;
      case "_managecrit_legacy":
        this.modal={type:"critical", roomId:t.getAttribute("data-room"), noteId:t.getAttribute("data-nid"), msg:null};
        this.render(); break;
      case "savecrit":
        this.doSaveCrit(false); break;
      case "resolvecrit":
        this.doSaveCrit(true); break;
      case "delnewcritphoto":
        if(this.modal && this.modal.type==="newcrit"){
          var selR2=el("ncRoom"); if(selR2) this.modal.roomId=selR2.value;
          var txtR2=el("ncText"); if(txtR2) this.modal.f={text:txtR2.value, assignId:(el("ncAssign")?el("ncAssign").value:"")};
          var npid=t.getAttribute("data-pid"); this.modal.photos=(this.modal.photos||[]).filter(function(x){return x.id!==npid;}); this.render();
        } break;
      case "delcritphoto":
        if(!this.modal || this.modal.type!=="critical"){ break; }
        if(!this.requireEdit()) break;
        var dcRoom=this.rooms[this.modal.roomId]; var dcN=dcRoom?(dcRoom.notes||[]).filter(function(x){return x.id===t.getAttribute("data-nid");})[0]:null;
        if(dcN){ var wk=(t.getAttribute("data-which")==="fix")?"fixPhotos":"issuePhotos"; var dpid=t.getAttribute("data-pid");
          dcN[wk]=(dcN[wk]||[]).filter(function(x){return x.id!==dpid;}); Store.saveRoom(dcRoom); this.render(); }
        break;
    }
  },

  /* pull current input values into the draft before saving */
  _commitDraftInputs:function(){
    var d=this.cfgDraft;
    var jn=el("jobName"), jnum=el("jobNumber"), jad=el("jobAddress");
    if(jn) d.job.name=jn.value.trim(); if(jnum) d.job.number=jnum.value.trim(); if(jad) d.job.address=jad.value.trim();
    var aSi=el("areaSingular"), aPl=el("areaPlural");
    if(aSi) d.areaSingular=aSi.value.trim()||"Room"; if(aPl) d.areaPlural=aPl.value.trim()||(d.areaSingular?d.areaSingular+"s":"Rooms");
    var wSa=el("workSat"); if(wSa) d.workSat=wSa.checked;
    var wSu=el("workSun"); if(wSu) d.workSun=wSu.checked;
    var an=el("adminName"), ap=el("adminPin");
    if(!d.admin) d.admin={pin:"",name:""};
    if(an) d.admin.name=an.value.trim(); if(ap) d.admin.pin=ap.value.trim();
    document.querySelectorAll('[data-action="edittask"]').forEach(function(inp){
      var ti=+inp.getAttribute("data-ti"); if(d.template[ti]) d.template[ti].name=inp.value;
    });
    document.querySelectorAll('[data-action="editsub"]').forEach(function(inp){
      var ti=+inp.getAttribute("data-ti"), si=+inp.getAttribute("data-si");
      if(d.template[ti] && d.template[ti].subs[si]) d.template[ti].subs[si].name=inp.value;
    });
    document.querySelectorAll('[data-action="edittaskdl"]').forEach(function(inp){
      var ti=+inp.getAttribute("data-ti"); if(d.template[ti]) d.template[ti].deadline=inp.value||"";
    });
  },

  /* read the material line-item rows currently in the modal DOM */
  _matReadRows:function(){
    var rows=[]; var qs=document.querySelectorAll(".modal .mq"); var ds=document.querySelectorAll(".modal .md2"); var us=document.querySelectorAll(".modal .mu");
    for(var i=0;i<Math.max(qs.length,ds.length);i++){
      rows.push({qty:qs[i]?qs[i].value:"", unit:(us[i]&&us[i].value==="ft")?"ft":"each", desc:ds[i]?ds[i].value:"", rid:(qs[i]&&qs[i].getAttribute("data-rid"))||uid("mi")});
    }
    if(!rows.length && this.modal && this.modal.f && this.modal.f.items) rows=this.modal.f.items.slice();
    return rows;
  },

  /* keep typed template edits in draft as you type (so re-render keeps them) */
  handleInput:function(e){
    var t=e.target;
    if(!t.getAttribute) return;
    if(t.id==="matOther"){ if(this.modal){ this.modal.f=this.modal.f||{}; this.modal.f.other=t.value; } return; }
    if(t.id==="critCmt"){
      if(this.modal){ this.modal.f=this.modal.f||{}; this.modal.f.cmt=t.value; }
      var pick=el("mentionPick");
      if(pick){
        var mm=/@([A-Za-z' .]*)$/.exec(t.value);
        if(mm){
          var q=mm[1].toLowerCase();
          var cand=this.mentionCandidates().filter(function(c){ return !q || c.name.toLowerCase().indexOf(q)===0 || c.name.toLowerCase().indexOf(" "+q)!==-1; }).slice(0,6);
          if(cand.length){
            pick.innerHTML=cand.map(function(c){ return '<button type="button" class="mp-item" data-action="mentionpick" data-uid="'+esc(c.id)+'" data-name="'+esc(c.name)+'">'+esc(c.name)+'</button>'; }).join('');
            pick.style.display="block";
          } else pick.style.display="none";
        } else pick.style.display="none";
      }
      return;
    }
    var a=t.getAttribute("data-action");
    if(a==="edittask"){ var ti=+t.getAttribute("data-ti"); if(this.cfgDraft && this.cfgDraft.template[ti]) this.cfgDraft.template[ti].name=t.value; }
    else if(a==="editsub"){ var ti2=+t.getAttribute("data-ti"), si=+t.getAttribute("data-si"); if(this.cfgDraft && this.cfgDraft.template[ti2] && this.cfgDraft.template[ti2].subs[si]) this.cfgDraft.template[ti2].subs[si].name=t.value; }
  },

  /* photo file input + inline completion-date edits */
  handleChange:function(e){
    if(e.target.getAttribute && e.target.getAttribute("data-action")==="roomdl"){
      var rdr=this.rooms[e.target.getAttribute("data-room")]; if(!rdr) return;
      rdr.deadline=e.target.value||"";
      if(e.target.classList) e.target.classList.toggle("has-dl", !!rdr.deadline);
      Store.saveRoom(rdr);
      this.logEvent("room_dl", rdr.deadline?("Set deadline "+rdr.deadline+" for "+this.areaS()+" "+rdr.number):("Cleared deadline for "+this.areaS()+" "+rdr.number));
      this.toast(rdr.deadline?"Deadline set":"Deadline cleared");
      return;
    }
    if(e.target.getAttribute && e.target.getAttribute("data-action")==="edittaskdl"){
      if(this.cfgDraft){ var tdI=+e.target.getAttribute("data-ti"); if(this.cfgDraft.template[tdI]) this.cfgDraft.template[tdI].deadline=e.target.value||""; }
      if(e.target.classList) e.target.classList.toggle("has-dl", !!e.target.value);
      return;
    }
    if(/^logF/.test(e.target.id||"")){
      var lf=this.logFilter||(this.logFilter={room:"",person:"",task:"",sub:"",from:"",to:""});
      var lv=e.target.value;
      if(e.target.id==="logFRoom") lf.room=lv;
      else if(e.target.id==="logFPerson") lf.person=lv;
      else if(e.target.id==="logFTask"){ lf.task=lv; lf.sub=""; }
      else if(e.target.id==="logFSub") lf.sub=lv;
      else if(e.target.id==="logFFrom") lf.from=lv;
      else if(e.target.id==="logFTo") lf.to=lv;
      this.render(); return;
    }
    if(e.target.id==="cpdfCmts"){ if(this.modal) this.modal.cmts=e.target.checked; return; }
    if(e.target.classList && e.target.classList.contains("cpdf-ck")){
      // remember manual checks/unchecks so a re-render (e.g. after Copy email report) keeps them
      if(this.modal && this.modal.type==="critpdf"){
        this.modal.sel=this.modal.sel||{};
        this.modal.sel[e.target.getAttribute("data-nid")]=e.target.checked;
        var stCk=el("cpdfStatus");
        if(stCk && !this.modal.busy){ var selN=0, selM=this.modal.sel; Object.keys(selM).forEach(function(k){ if(selM[k]) selN++; }); stCk.textContent=selN+" selected"; }
      }
      return;
    }
    if(e.target.id==="critStage"){
      if(!this.modal || this.modal.type!=="critical" || !this.isManager()) return;
      var srm=this.rooms[this.modal.roomId]; if(!srm) return;
      var snS=(srm.notes||[]).filter(function(x){return x.id===App.modal.noteId;})[0]; if(!snS) return;
      var stV=e.target.value;
      if(stV==="__custom"){ var cust=prompt("Custom progress tag:", snS.stage||""); if(cust===null){ this.render(); return; } stV=cust.trim(); }
      snS.stage=stV;
      Store.saveRoom(srm);
      this.logEvent("crit_stage", stV?('Tagged a critical "'+stV+'"'):"Cleared a critical progress tag", this.areaS()+" "+srm.number);
      this.toast(stV?("Tagged: "+stV):"Tag cleared");
      this._critPreserve(); this.render(); return;
    }
    if(e.target.id==="critAssign"){
      if(!this.modal || this.modal.type!=="critical" || !this.isManager()) return;
      var arm=this.rooms[this.modal.roomId]; if(!arm) return;
      var an=(arm.notes||[]).filter(function(x){return x.id===App.modal.noteId;})[0]; if(!an) return;
      var aid=e.target.value; var au=aid?this.users[aid]:null;
      an.assignedId=aid||""; an.assignedName=au?au.name:""; an.assignedCompany=au?(au.company||""):"";
      Store.saveRoom(arm);
      this.logEvent("crit_assign", aid?("Assigned critical to "+(au?au.name:"someone")):"Unassigned a critical item", this.areaS()+" "+arm.number);
      this.toast(aid?("Assigned to "+(au?au.name:"")):"Unassigned"); this.render(); return;
    }
    if(e.target.getAttribute && e.target.getAttribute("data-action")==="setdate"){
      var room=this.roomId?this.rooms[this.roomId]:null; if(!room) return;
      var key=e.target.getAttribute("data-key"); var val=e.target.value;
      var cur=room.done&&room.done[key];
      if(cur){ if(cur===true){ cur={date:val}; } else { cur.date=val; } room.done[key]=cur; Store.saveRoom(room); }
      this._editDate=null; this.render(); return;
    }
    if(e.target.id==="drawingPdf"){
      if(!this.isManager()){ e.target.value=""; return; }
      var pf=e.target.files&&e.target.files[0]; if(!pf){ return; }
      if(!window.pdfjsLib){ this.toast("PDF engine still loading — try again in a moment"); e.target.value=""; return; }
      var pst=el("drawingStatus"); if(pst) pst.textContent="Reading PDF…";
      var self0=this; var fname=(pf.name||"Drawing").replace(/\.pdf$/i,"").slice(0,60);
      Draw.renderPdf(pf, function(i,n){ if(pst) pst.textContent="Rendering page "+i+" of "+n+"…"; }).then(function(pages){
        if(pst) pst.textContent="Uploading "+pages.length+" page"+(pages.length===1?"":"s")+"…";
        return Promise.all(pages.map(function(pg){ return Store.uploadPhoto(self0.projectId+"/drawings", pg.blob).then(function(url){ return {url:url, w:pg.w, h:pg.h}; }); }));
      }).then(function(pgRecs){
        var d={ id:uid("dw"), name:fname, pages:pgRecs, ts:Date.now() };
        self0.config.drawings=(self0.config.drawings||[]); self0.config.drawings.push(d);
        return Store.saveProject(self0.config).then(function(){ App.logEvent("config","Uploaded drawing “"+fname+"” ("+pgRecs.length+" page"+(pgRecs.length===1?"":"s")+")"); if(pst) pst.textContent=""; App.toast("Drawing added"); App.render(); });
      }).catch(function(err){ console.error("PDF import failed", err); if(pst) pst.textContent="Couldn’t read that PDF — try another export."; App.toast("Couldn’t process the PDF"); });
      e.target.value="";
      return;
    }
    if(e.target.name==="matDel"){
      if(this.modal && (this.modal.type==="matnew" || (this.modal.type==="matview"&&this.modal.editing))){
        this._matPreserve(); this.modal.f.deliverTo=e.target.value; this.render();
      }
      return;
    }
    if(e.target.getAttribute && (e.target.getAttribute("data-action")==="recvqty" || e.target.getAttribute("data-action")==="recvnote")){
      if(!this.modal || this.modal.type!=="matview") return;
      var uRq=this.requireEdit(); if(!uRq) return;
      var mrRq=this.materials[this.modal.mid]; if(!mrRq) return;
      var rRq=this._recvItem(mrRq, e.target.getAttribute("data-iid"));
      if(e.target.getAttribute("data-action")==="recvqty") rRq.qtyGot=e.target.value; else rRq.note=e.target.value;
      rRq.byName=uRq.name; rRq.ts=Date.now();
      Store.saveMaterial(mrRq);
      this.render();
      return;
    }
    if(e.target.classList && e.target.classList.contains("rvp")){
      if(!this.modal || this.modal.type!=="matview"){ e.target.value=""; return; }
      var uRp=this.requireEdit(); if(!uRp){ e.target.value=""; return; }
      var mrRp=this.materials[this.modal.mid]; if(!mrRp){ e.target.value=""; return; }
      var iidP=e.target.getAttribute("data-iid")||"";
      var rpfs=Array.prototype.slice.call(e.target.files||[]); if(!rpfs.length) return;
      var stP=el("rvpSt-"+iidP); if(stP) stP.textContent="Uploading photo…";
      var rpfr=rpfs.map(function(){return 0;});
      function rvpPaint(){ var agg=rpfr.reduce(function(a2,b2){return a2+b2;},0)/rpfs.length; var s3=el("rvpSt-"+iidP); if(s3) s3.textContent="Uploading photo… "+Math.round(agg*100)+"%"; }
      Promise.all(rpfs.map(function(f,i){
        return Store.uploadPhoto(App.projectId+"/materials", f, function(p){ rpfr[i]=p; rvpPaint(); }).then(function(url){
          var rR2=App._recvItem(mrRp, iidP);
          (rR2.photos=rR2.photos||[]).push({id:uid("p"),url:url,by:uRp.name,when:new Date().toISOString()});
          rpfr[i]=1; rvpPaint();
        }).catch(function(err){ console.warn("receiving photo failed",err); rpfr[i]=1; App.toast("A photo didn’t upload — try again"); });
      })).then(function(){
        Store.saveMaterial(mrRp);
        App.logEvent("mat_recv_photo","Added a receiving photo on "+(mrRp.po||""));
        App.render();
      });
      e.target.value="";
      return;
    }
    if(e.target.classList && e.target.classList.contains("mip")){
      var mm2=this.modal;
      if(!mm2 || (mm2.type!=="matnew" && !(mm2.type==="matview"&&mm2.editing))){ e.target.value=""; return; }
      var uMi=this.requireEdit(); if(!uMi){ e.target.value=""; return; }
      var ridI=e.target.getAttribute("data-rid")||"";
      var mifs=Array.prototype.slice.call(e.target.files||[]); if(!mifs.length) return;
      this._matPreserve(); mm2.f.phMap=mm2.f.phMap||{};
      mm2.pending=(mm2.pending||0)+mifs.length;
      var stI=el("mipSt-"+ridI); if(stI) stI.textContent="Uploading photo…";
      var mifr=mifs.map(function(){return 0;});
      function mipPaint(){ var agg=mifr.reduce(function(a,b){return a+b;},0)/mifs.length; var s2=el("mipSt-"+ridI); if(s2) s2.textContent="Uploading photo… "+Math.round(agg*100)+"%"; }
      Promise.all(mifs.map(function(f,i){
        return Store.uploadPhoto(App.projectId+"/materials", f, function(p){ mifr[i]=p; mipPaint(); }).then(function(url){
          var mmx=App.modal;
          if(mmx && mmx.f && mmx.f.phMap){ (mmx.f.phMap[ridI]=mmx.f.phMap[ridI]||[]).push({id:uid("p"),url:url,by:uMi.name,when:new Date().toISOString()}); }
          mifr[i]=1; mipPaint();
        }).catch(function(err){ console.warn("item photo failed",err); mifr[i]=1; App.toast("A photo didn’t upload — try again"); });
      })).then(function(){
        var mmx=App.modal; if(mmx){ mmx.pending=Math.max(0,(mmx.pending||0)-mifs.length); }
        App._matPreserve(); App.render();
      });
      e.target.value="";
      return;
    }
    if(e.target.id==="matPhoto"){
      if(!this.modal || this.modal.type!=="matview") return;
      var uMp=this.requireEdit(); if(!uMp){ e.target.value=""; return; }
      var mrP=this.materials[this.modal.mid]; if(!mrP) return;
      var mfiles=Array.prototype.slice.call(e.target.files||[]); if(!mfiles.length) return;
      this.modal.f=this.modal.f||{}; this.modal.f.note=(el("matNote")?el("matNote").value:this.modal.f.note||"");
      var mst=el("matPhotoStatus"); if(mst) mst.innerHTML='Uploading&hellip;<div class="upbar"><div class="upfill" id="mpBarFill"></div></div>';
      var mfr=mfiles.map(function(){return 0;});
      function mpaint(){ var agg=mfr.reduce(function(a,b){return a+b;},0)/mfiles.length; var bf=el("mpBarFill"); if(bf) bf.style.width=Math.round(agg*100)+"%"; }
      mrP.photos=mrP.photos||[];
      Promise.all(mfiles.map(function(f,i){
        return Store.uploadPhoto(App.projectId+"/materials", f, function(p){ mfr[i]=p; mpaint(); }).then(function(url){
          mrP.photos.push({id:uid("p"),url:url,by:uMp.name,when:new Date().toISOString()}); mfr[i]=1; mpaint();
        }).catch(function(err){ console.warn("material photo failed",err); mfr[i]=1; });
      })).then(function(){
        Store.saveMaterial(mrP);
        App.logEvent("mat_photo","Added a photo to material request "+(mrP.po||""));
        App.render();
      });
      return;
    }
    if(e.target.id==="ncPhoto"){
      if(!this.modal || this.modal.type!=="newcrit") return;
      var uNc=this.requireEdit(); if(!uNc){ e.target.value=""; return; }
      var ncfiles=Array.prototype.slice.call(e.target.files||[]); if(!ncfiles.length) return;
      var selR=el("ncRoom"); if(selR) this.modal.roomId=selR.value;
      var txtR=el("ncText"); if(txtR) this.modal.f={text:txtR.value, assignId:(el("ncAssign")?el("ncAssign").value:"")};
      this.modal.photos=this.modal.photos||[]; var rid=this.modal.roomId;
      // pending-upload tracking: photos can NEVER be lost — if the critical is
      // logged mid-upload, finished photos attach to the saved note by id.
      this.modal.pending=(this.modal.pending||0)+ncfiles.length;
      var fr=ncfiles.map(function(){return 0;}); var ncdone=0, ntot=ncfiles.length;
      function paint(){
        var agg=fr.reduce(function(a,b){return a+b;},0)/ntot;
        if(App.modal && App.modal.type==="newcrit") App.modal.upFrac=agg;
        var bar=el("ncBarFill"); if(bar) bar.style.width=Math.round(agg*100)+"%";
        var stt=el("ncStatus"); if(stt) stt.textContent="Uploading photo "+Math.min(ncdone+1,ntot)+" of "+ntot+" — "+Math.round(agg*100)+"%";
      }
      this.render(); paint();
      ncfiles.forEach(function(f,i){
        Store.uploadPhoto(rid||"newcrit", f, function(p){ fr[i]=p; paint(); }).then(function(url){
          var photo={id:uid("cp"),url:url,by:uNc.name,when:new Date().toISOString()};
          ncdone++; fr[i]=1;
          if(App.modal && App.modal.type==="newcrit"){
            App.modal.photos.push(photo);
            App.modal.pending=Math.max(0,(App.modal.pending||1)-1);
            if(el("ncRoom")) App.modal.roomId=el("ncRoom").value;
            App.modal.f={ text:(el("ncText")?el("ncText").value:((App.modal.f&&App.modal.f.text)||"")), assignId:(el("ncAssign")?el("ncAssign").value:((App.modal.f&&App.modal.f.assignId)||"")) };
            if(App.modal.pending===0) App.render(); else paint();
          } else if(App._ncTarget){
            // the critical was already logged — attach this photo to it by id
            var tr=App.rooms[App._ncTarget.roomId];
            var tn=tr&&(tr.notes||[]).filter(function(x){return x.id===App._ncTarget.noteId;})[0];
            if(tn){ tn.issuePhotos=tn.issuePhotos||[]; tn.issuePhotos.push(photo); Store.saveRoom(tr); App.toast("Photo attached to the critical"); App.render(); }
          }
        }).catch(function(err){
          console.warn("newcrit photo failed",err); ncdone++; fr[i]=1;
          if(App.modal && App.modal.type==="newcrit"){ App.modal.pending=Math.max(0,(App.modal.pending||1)-1); var s2=el("ncStatus"); if(s2) s2.textContent="One photo failed to upload — try it again."; }
          else App.toast("A photo failed to upload — add it from the critical item.");
        });
      });
      return;
    }
    if(e.target.id==="critIssuePhoto" || e.target.id==="critFixPhoto"){
      if(!this.modal || this.modal.type!=="critical") return;
      var which=(e.target.id==="critFixPhoto")?"fixPhotos":"issuePhotos";
      var croom=this.rooms[this.modal.roomId]; if(!croom) return;
      var cn=(croom.notes||[]).filter(function(x){return x.id===App.modal.noteId;})[0]; if(!cn) return;
      var uCp=this.requireEdit(); if(!uCp){ e.target.value=""; return; }
      var cfiles=Array.prototype.slice.call(e.target.files||[]); if(!cfiles.length) return;
      var cst=el(which==="fixPhotos"?"critFixStatus":"critIssueStatus"); if(cst) cst.innerHTML='Uploading&hellip;<div class="upbar"><div class="upfill" id="cpBarFill"></div></div>';
      cn[which]=cn[which]||[]; var cdone=0; var cfr=cfiles.map(function(){return 0;});
      function cpaint(){ var agg=cfr.reduce(function(a,b){return a+b;},0)/cfiles.length; var bf=el("cpBarFill"); if(bf) bf.style.width=Math.round(agg*100)+"%"; }
      Promise.all(cfiles.map(function(f,i){
        return Store.uploadPhoto(croom.id,f,function(p){ cfr[i]=p; cpaint(); }).then(function(url){ cn[which].push({id:uid("cp"),url:url,by:uCp.name,when:new Date().toISOString()}); cdone++; cfr[i]=1; cpaint(); })
          .catch(function(err){ console.warn("crit photo failed",err); cfr[i]=1; });
      })).then(function(){
        // keep any fix note typed while the photo uploaded
        var rEl=el("critReply"); if(rEl){ cn.reply=rEl.value.trim(); if(cn.reply && !cn.replyBy){ cn.replyBy=(App.session&&App.session.name)||"Office"; } }
        Store.saveRoom(croom);
        App.logEvent(which==="fixPhotos"?"crit_reply":"crit_add",(which==="fixPhotos"?"Added fix photo to a critical item":"Added issue photo to a critical item"),App.areaS()+" "+croom.number,uCp);
        App.render();
      });
      return;
    }
    if(e.target.id==="attachPhoto"){
      var aroom=this.modal&&this.modal.roomId?this.rooms[this.modal.roomId]:null; if(!aroom) return;
      var uAp=this.requireEdit(); if(!uAp){ e.target.value=""; return; }
      var afiles=Array.prototype.slice.call(e.target.files||[]); if(!afiles.length) return;
      var ast=el("attachStatus"); if(ast) ast.textContent="Uploading "+afiles.length+" photo(s)…";
      var adone=0; aroom.photos=aroom.photos||[]; var akey=this.modal.key, akname=this.modal.name;
      Promise.all(afiles.map(function(f){
        return Store.uploadPhoto(aroom.id,f).then(function(url){
          aroom.photos.push({id:uid("p"),url:url,when:new Date().toISOString(),byId:uAp.id,byName:uAp.name,byCompany:uAp.company||"",taskKey:akey,taskName:akname});
          adone++; if(ast) ast.textContent="Uploaded "+adone+"/"+afiles.length;
        }).catch(function(err){ console.warn("attach photo failed",err); });
      })).then(function(){
        Store.saveRoom(aroom);
        App.logEvent("photo_add","Added "+adone+" photo"+(adone===1?"":"s")+" on “"+akname+"”",App.areaS()+" "+aroom.number,uAp);
        App.render();
      });
      return;
    }
    if(e.target.id==="photoInput"){
      var room=this.roomId?this.rooms[this.roomId]:null; if(!room) return;
      var uPh=this.requireEdit(); if(!uPh){ e.target.value=""; return; }
      var files=Array.prototype.slice.call(e.target.files||[]);
      if(!files.length) return;
      var st=el("photoStatus"); if(st) st.textContent="Uploading "+files.length+" photo(s)…";
      var done=0;
      room.photos=room.photos||[];
      Promise.all(files.map(function(f){
        return Store.uploadPhoto(room.id,f).then(function(url){
          room.photos.push({id:uid("p"),url:url,when:new Date().toISOString(),byId:uPh.id,byName:uPh.name,byCompany:uPh.company||""});
          done++; if(st) st.textContent="Uploaded "+done+"/"+files.length;
        }).catch(function(err){ console.warn("photo upload failed",err); });
      })).then(function(){
        Store.saveRoom(room);
        App.logEvent("photo_add","Added "+done+" photo"+(done===1?"":"s"), App.areaS()+" "+room.number, uPh);
        App.render();
      });
    }
  },

  toast:function(msg){
    var d=document.createElement("div");
    d.textContent=msg;
    d.style.cssText="position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:8px;font-weight:700;font-size:13px;z-index:60;box-shadow:var(--shadow-btn)";
    document.body.appendChild(d); setTimeout(function(){ d.remove(); },1600);
  }
};

/* wire events */
// Track where a press/tap begins so backdrop-dismiss only fires when the press
// BOTH starts and ends on the backdrop. Prevents a field tap that shifts the
// layout (mobile keyboard) from accidentally closing the modal.
document.addEventListener("pointerdown", function(e){
  App._downOnBg = !!(e.target && e.target.classList && (e.target.classList.contains("modal-bg") || e.target.classList.contains("lightbox")));
}, true);
// kanban card drag (critical board)
document.addEventListener("pointerdown", function(e){ App.kbDown(e); });
document.addEventListener("pointermove", function(e){ App.kbMove(e); }, {passive:false});
document.addEventListener("pointerup", function(e){ App.kbUp(e); });
document.addEventListener("pointercancel", function(e){ App.kbUp(e); });
document.addEventListener("click", function(e){ App.handle(e); });
document.addEventListener("input", function(e){ App.handleInput(e); });
document.addEventListener("change", function(e){ App.handleChange(e); });
document.addEventListener("keydown", function(e){
  if(e.key==="Escape" && document.querySelector(".lightbox")){ App.closeLightbox(); return; }
  if(e.key!=="Enter" || !App.modal) return;
  if(App.modal.type==="login"){ e.preventDefault(); var p=el("pinInput"); App.doLogin(p?p.value:""); }
  else if(App.modal.type==="createuser"){ e.preventDefault(); App.submitCreateUser(el("cuName").value, el("cuCompany").value, el("cuPin").value); }
  else if(App.modal.type==="edituser"){ e.preventDefault(); App.doSaveUser(); }
  else if(App.modal.type==="adduser"){ e.preventDefault(); App.doAddUser(); }
});

/* condense the pinned progress bar once the page is scrolled */
window.addEventListener("scroll", function(){
  document.body.classList.toggle("scrolled", window.scrollY>30);
}, {passive:true});

/* phone back button: overlays close first, then history walks views (one back = up) */
window.addEventListener("popstate", function(ev){
  function rearm(){ try{ history.pushState({view:App.view, roomId:App.roomId||null}, ""); }catch(e){} }
  if(typeof Draw!=="undefined" && Draw.ov){ Draw.close(); rearm(); return; }
  if(document.querySelector(".lightbox")){ App.closeLightbox(); rearm(); return; }
  if(App.modal){ App.closeModal(); App.modal=null; rearm(); return; }
  var st=ev.state;
  if(st && st.view){ App._fromPop=true; App.go(st.view, st.roomId||undefined); App._fromPop=false; }
});

document.addEventListener("DOMContentLoaded", function(){ App.start(); try{ history.replaceState({view:App.view, roomId:App.roomId||null}, ""); }catch(e){} });
if(document.readyState!=="loading"){ App.start(); }
</script>
