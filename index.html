  /* daily dated completions across the whole project: {ymd: count} */
  _dailyCompletions:function(){
    var tpl=this.template(); var ids=[];
    tpl.forEach(function(t){ if(t.subs&&t.subs.length){ t.subs.forEach(function(s){ids.push(s.id);}); } else ids.push(t.id); });
    var by={};
    this.roomList().forEach(function(r){ ids.forEach(function(id){ var v=r.done&&r.done[id]; if(!v) return;
      var dt=(v!==true&&v.date)?v.date:((v!==true&&v.ts)?tsYMD(v.ts):null); if(dt) by[dt]=(by[dt]||0)+1; }); });
    return by;
  },
  /* small report: rooms with deadlines — past due / in danger / no pace / on track */
  _deadlineReport:function(rs){
    var aS=this.areaS(), aP=this.areaP();
    var withDl=rs.list.filter(function(r){ return r.dl&&r.status!=="done"; });
    var doneDl=rs.list.filter(function(r){ return r.dl&&r.status==="done"; });
    if(!withDl.length&&!doneDl.length){
      return '<div class="small muted" style="margin-bottom:6px">No '+esc(aS.toLowerCase())+' deadlines set — '+esc(aP.toLowerCase())+' follow the task deadlines above. If one '+esc(aS.toLowerCase())+' has to be done by a certain day, set its date in Config and it shows up here.</div>';
    }
    var groups=[
      {key:"overdue", tag:"PAST DUE",  col:"#c23b2e", items:[]},
      {key:"risk",    tag:"IN DANGER", col:"#b8690a", items:[]},
      {key:"watch",   tag:"NO PACE",   col:"#8b97a3", items:[]},
      {key:"ontrack", tag:"ON TRACK",  col:"#2e7d4f", items:[]}
    ];
    withDl.forEach(function(r){ groups.forEach(function(g){ if(g.key===r.status) g.items.push(r); }); });
    var trouble=groups[0].items.length+groups[1].items.length;
    var out='<div class="dl-card">';
    out+='<div style="font-weight:800;font-family:\'Barlow Semi Condensed\',sans-serif;font-size:15px;margin-bottom:2px">'+
      (trouble? (trouble+' '+esc(trouble===1?aS.toLowerCase():aP.toLowerCase())+' need'+(trouble===1?'s':'')+' attention') : ('Every '+esc(aS.toLowerCase())+' with a deadline is on track'))+'</div>';
    groups.forEach(function(g){
      g.items.sort(function(a,b){ return (a.dl-b.dl)||String(a.number).localeCompare(String(b.number),undefined,{numeric:true}); });
      g.items.forEach(function(r){
        var line;
        if(r.status==="overdue") line='was due '+fmtMD(r.dl)+' — '+r.pct+'% done'+(r.fin?', pace says ~'+fmtMD(r.fin):'');
        else if(r.status==="risk") line='due '+fmtMD(r.dl)+', pace says ~'+fmtMD(r.fin)+' — needs to speed up';
        else if(r.status==="watch") line='due '+fmtMD(r.dl)+' — nothing dated logged yet, no pace to go on';
        else line='due '+fmtMD(r.dl)+', pace says ~'+fmtMD(r.fin)+' &#10003;';
        out+='<div class="dl-row"><span class="dl-dot" style="background:'+g.col+'"></span>'+
          '<span class="dl-room">'+esc(aS)+' '+esc(r.number)+'</span>'+
          '<span class="dl-line">'+line+'</span>'+
          '<span class="dl-tag" style="color:'+g.col+'">'+g.tag+'</span></div>';
      });
    });
    if(doneDl.length){ out+='<div class="dl-row"><span class="dl-dot" style="background:#2e7d4f"></span><span class="dl-line">'+doneDl.length+' '+esc((doneDl.length===1?aS:aP).toLowerCase())+' with a deadline already complete &#10003;</span></div>'; }
    out+='<div class="small muted" style="margin-top:6px">'+esc(aP)+' without a date just follow the task deadlines above.</div></div>';
    return out;
  },
  drawingById:function(id){ return this.drawingsList().filter(function(d){return d.id===id;})[0]||null; },
  /* open a drawing full-screen (view mode) showing every critical marker on it */

  recentActivity:function(limit){
    var tpl=this.template(); var nameOf={};
    tpl.forEach(function(task){ nameOf[task.id]={task:task.name, sub:null}; (task.subs||[]).forEach(function(s){ nameOf[s.id]={task:task.name, sub:s.name}; }); });
    var items=[];
    this.roomList().forEach(function(r){
      var done=r.done||{};
      Object.keys(done).forEach(function(k){
        var v=done[k]; if(!v||v===true||!v.ts) return;
        var nm=nameOf[k]; if(!nm) return;
        items.push({roomId:r.id, room:r.number, task:nm.task, sub:nm.sub, name:v.name||"", company:v.company||"", ts:v.ts});
      });
    });
    items.sort(function(a,b){ return b.ts-a.ts; });
    return limit?items.slice(0,limit):items;
  },
  /* open (unresolved) critical notes across all rooms, newest first */
  /* open criticals assigned to the signed-in user: [{roomId, room, note}] */
  myCriticals:function(){
    var u=this.currentUser(); if(!u) return [];
    var out=[];
    this.roomList().forEach(function(r){ (r.notes||[]).forEach(function(n){
      if(!n.critical || critLane(n)==="done") return;
      var mine=(n.assignedId && n.assignedId===u.id) || (!n.assignedId && n.assignedName && n.assignedName===u.name);
      if(mine) out.push({roomId:r.id, room:r.number, note:n});
    }); });
    out.sort(function(a,b){ return (b.note.ts||0)-(a.note.ts||0); });
    return out;
  },
  criticalOpen:function(){
    var out=[];
    this.roomList().forEach(function(r){
      (r.notes||[]).forEach(function(n){ if(n.critical && n.status!=="done"){ out.push({roomId:r.id, room:r.number, note:n}); } });
    });
    out.sort(function(a,b){ return (b.note.ts||0)-(a.note.ts||0); });
    return out;
  },

  render:function(){
    var app=el("app");
    if(!this.ready && this.config===null && Object.keys(this.rooms).length===0 && Store.mode==="cloud"){
      // still fine to render; cloud may just be empty
    }
    var html="";
    html += this.renderHeader();
    if(this.view==="overview") html += this.renderOverview();
    else if(this.view==="room") html += this.renderRoom();
    else if(this.view==="config") html += this.renderConfig();
    else if(this.view==="labels") html += this.renderLabels();
    else if(this.view==="map") html += '<div class="wrap">'+this.renderMapContent()+'</div>';
    else if(this.view==="log") html += this.renderLog();
    else if(this.view==="punchlist") html += this.renderPunchList();
    else if(this.view==="roomsheet") html += this.renderRoomSheet();
    else if(this.view==="projects") html += this.renderProjects();
    else if(this.view==="critlist") html += this.renderCritList();
    else if(this.view==="drawings") html += this.renderDrawings();
    else if(this.view==="critreport") html += this.renderCritReport();
    else if(this.view==="admin") html += this.renderAdmin();
    else if(this.view==="materials") html += this.renderMaterials();
    if(this.config || this.projectList().length) html += this.renderBottomNav();
    app.innerHTML = html;
    var hh=document.querySelector(".app-header");
    if(hh) document.documentElement.style.setProperty("--hdrh", hh.offsetHeight+"px");
    this._anim=null; // one-shot: only animate on the navigation that set it
    if(this.modal) this.mountModal();
    this.renderStatus();
    this.bindTemplateAutoQR();
  },

  renderStatus:function(){
    var p=el("connpill"); if(!p) return;
    if(Store.mode!=="cloud"){ p.className="pill local"; p.innerHTML='<span class="dot"></span>Local only'; return; }
    if(Store.online){ p.className="pill online"; p.innerHTML='<span class="dot"></span>Office connected'; }
    else { p.className="pill local"; p.innerHTML='<span class="dot"></span>Offline · saving'; }
  },

    return "more";

      critical:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4 L21 19 H3 Z" stroke-linejoin="round"/><line x1="12" y1="10" x2="12" y2="14.2"/><circle cx="12" cy="16.6" r="0.4" fill="currentColor"/></svg>',

      '<button class="'+(tab==="map"?"on":"")+'" data-action="navtab" data-t="map">'+ic.map+'Map</button>'+
      '<button class="'+(tab==="more"?"on":"")+'" data-action="navtab" data-t="more" style="position:relative">'+ic.more+'More'+((this.isManager()&&this.matNewCount())?'<span class="bn-badge">'+this.matNewCount()+'</span>':'')+'</button>'+
      '</div>';

      right = room ? '<button class="hdr-btn icon" data-action="qr" data-room="'+esc(room.id)+'">QR</button>' : '';
    } else if(this.view==="config"){
      title="Config"; meta=esc(jobName);
      left='<button class="hdr-btn icon" data-action="go" data-view="overview">&larr;</button>'; right='';
    } else if(this.view==="map"){
      title="Floor Map"; meta=esc(jobName);
      left=''; right='';
    } else if(this.view==="log"){
      title="Activity Log"; meta=esc(jobName);
      left='<button class="hdr-btn icon" data-action="go" data-view="overview">&larr;</button>'; right='';
    } else if(this.view==="projects"){
      title="Projects"; meta="All projects";
      left=(this.config?'<button class="hdr-btn icon" data-action="go" data-view="overview">&larr;</button>':''); right='';
    } else if(this.view==="punchlist"){
      title="Punch List"; meta=esc(jobName);
      left='<button class="hdr-btn icon" data-action="go" data-view="overview">&larr;</button>'; right='';
    } else if(this.view==="critlist"){
      title="Critical Items"; meta=esc(jobName);
      left=''; right='';
    } else if(this.view==="drawings"){
      title="Drawings"; meta=esc(jobName);
      left='<button class="hdr-btn icon" data-action="go" data-view="overview">&larr;</button>'; right='';
    } else if(this.view==="admin"){
      title="Admin Dashboard"; meta=esc(jobName);
      left='<button class="hdr-btn icon" data-action="go" data-view="overview">&larr;</button>'; right='';
    } else if(this.view==="materials"){
      title="Materials"; meta=esc(jobName);
      left='<button class="hdr-btn icon" data-action="go" data-view="overview">&larr;</button>'; right='';
    } else if(this.view==="critreport"){
      title="Critical Report"; meta=esc(jobName);
      var crBack=(this._prevView==="room" && this.roomId && this.rooms[this.roomId])?"room":"critlist";
      left='<button class="hdr-btn icon" data-action="go" data-view="'+crBack+'">&larr;</button>';
      right='<button class="hdr-btn no-print" data-action="print">Print</button>';
    } else if(this.view==="roomsheet"){
      var rsr=this.rooms[this.roomId];
      title=this.areaS()+" Sheet"; meta=rsr?(this.areaS()+" "+esc(rsr.number)):esc(jobName);
      left='<button class="hdr-btn icon" data-action="go" data-view="room">&larr;</button>'; right='';
    } else if(this.view==="labels"){
      title="QR Labels"; meta=esc(jobName);
      left='<button class="hdr-btn icon" data-action="go" data-view="overview">&larr;</button>';
      right='<button class="hdr-btn no-print" data-action="print">Print</button>';
    } else {
      title=esc(jobName); meta = (job.number?("Job "+esc(job.number)+" · "):"")+(job.address?esc(job.address):"Room progress");
      left=''; right='';
    }
    // auth control + user chip
    var u=this.currentUser();

                    : '<button class="hdr-btn icon" data-action="login">Log in</button>';
    var roleTxt = u ? (u.role==="admin"?"Office":(u.provisional?"pending":(u.role==="pm"?("PM"+(u.company?" · "+u.company:"")):(u.company||"")))) : "";
    var chip = u ? '<span class="user-chip"><span class="av">'+esc(initials(u.name))+'</span>'+
                   '<span class="nm">'+esc(u.name)+'</span>'+(roleTxt?'<span class="co">· '+esc(roleTxt)+'</span>':'')+'</span>'
                 : '';
    return '<div class="app-header"><div class="hdr-row">'+
      (left||'')+

      (right||'')+ authBtn +
      '</div><div class="hdr-row" style="margin-top:2px;gap:8px;align-items:center"><span id="connpill" class="pill local"><span class="dot"></span>&hellip;</span>'+chip+'</div></div>';
  },

  /* ---------- overview ---------- */
  renderOverview:function(){
    // no projects yet — first run of a fresh install
    if(!this.projectList().length && !this.config){
      return '<div class="wrap"><div class="summary"><div class="sub">Welcome</div><div class="big" style="font-size:22px">No projects yet</div>'+
        '<div class="sub">Create your first project to get started</div></div>'+
        '<button class="btn btn-primary btn-block" data-action="newproject">Create a project</button></div>';
    }
    if(!this.config){ return '<div class="wrap"><div class="empty">Loading&hellip;</div></div>'; }
    var rooms=this.roomList(); var tpl=this.template(); var aS=this.areaS(), aP=this.areaP();
    var projBar='<button class="proj-bar" data-action="go" data-view="projects"><span class="pb-label">Project</span><span class="pb-name">'+esc(this.projName())+'</span><span class="pb-switch">Switch &#9662;</span></button>';
    if(rooms.length===0){
      return '<div class="wrap">'+projBar+'<div class="summary"><div class="sub">'+esc(this.projName())+'</div>'+
        '<div class="big">0</div><div class="sub">'+esc(aP.toLowerCase())+' added yet</div></div>'+
        '<div class="empty">No '+esc(aP.toLowerCase())+' yet. Add them in Config to get started.</div>'+
        '<button class="btn btn-primary btn-block" data-action="go" data-view="config">Add '+esc(aP.toLowerCase())+'</button></div>';
    }
    // aggregate
    var d=0,t=0,complete=0,started=0;
    rooms.forEach(function(r){ var u=roomUnits(tpl,r); d+=u.done; t+=u.total; var p=roomPct(tpl,r); if(p>=100)complete++; else if(p>0)started++; });
    var overall = t? Math.round(d/t*100):0;

    var out='<div class="wrap'+this._animClass("overview")+'">'+projBar;

    // overall progress — pinned under the header while you scroll
    out += '<div class="summary stick"><div class="sub">'+esc(this.projName())+' — overall</div>'+
      '<div class="big">'+overall+'%</div>'+
      '<div class="pbar lg"><div class="pfill'+(overall>=100?' done':'')+'" style="width:'+overall+'%"></div></div>'+
      '<div class="stat-row">'+
        '<div class="stat"><div class="n">'+rooms.length+'</div><div class="t">'+esc(aP)+'</div></div>'+
        '<div class="stat"><div class="n">'+started+'</div><div class="t">In progress</div></div>'+
        '<div class="stat"><div class="n">'+complete+'</div><div class="t">Complete</div></div>'+
      '</div></div>';

    // you were mentioned — unseen @mentions on criticals
    var men=this.myMentions();
    if(men.length){
      out += '<div class="ment-wrap"><div class="mine-head" style="color:#0d4f8b;border-color:#c3d6e8"><span class="mine-flag">@</span>You were mentioned ('+men.length+')</div>';
      men.slice(0,5).forEach(function(it){
        var snip=String(it.c.text||""); if(snip.length>80) snip=snip.slice(0,78)+"…";
        out += '<div class="rc-crit new" style="border-left-color:#0d4f8b" data-action="managecrit" data-room="'+esc(it.roomId)+'" data-nid="'+esc(it.nid)+'" style="cursor:pointer">'+
          '<div class="rcc-top"><span style="font-family:\'Barlow Semi Condensed\',sans-serif;font-weight:700;font-size:12px">'+esc(it.c.byName||"Someone")+'</span>'+
          '<span style="font-size:11px;color:var(--muted)">'+esc(App.areaS())+' '+esc(it.room)+'</span>'+
          '<span class="rcc-when">'+esc(relTime(it.c.ts))+'</span></div>'+
          '<div class="rcc-text">'+esc(snip)+'</div></div>';
      });
      out += '<div class="small muted" style="margin-top:6px">Tap to open — that clears the notification.</div></div>';
    }

    // assigned to you — the signed-in person's open criticals, front and center
    var mine=this.myCriticals();
    if(mine.length){
      var meName=(this.currentUser()||{}).name||"you";
      out += '<div class="mine-wrap"><div class="mine-head"><span class="mine-flag">&#9873;</span>Assigned to you ('+mine.length+')</div>';
      mine.forEach(function(it){ var n=it.note; var lane=critLane(n);
        var laneLbl=lane==="inprogress"?"In progress":"New";
        var laneCls=lane==="inprogress"?"prog":"new";
        out += '<div class="rc-crit '+laneCls+'" data-action="managecrit" data-room="'+esc(it.roomId)+'" data-nid="'+esc(n.id)+'" style="cursor:pointer">'+
          '<div class="rcc-top"><span class="rcc-lane '+laneCls+'">'+laneLbl+'</span>'+
            '<span style="font-family:\'Barlow Semi Condensed\',sans-serif;font-weight:700;font-size:12px">'+esc(App.areaS())+' '+esc(it.room)+'</span>'+
            '<span class="rcc-when">'+esc(relTime(n.ts))+'</span></div>'+
          '<div class="rcc-text">'+esc(n.text)+'</div>'+
          '</div>';
      });
      out += '<div class="small muted" style="margin-top:6px">Tap one to add fix photos or mark it resolved.</div></div>';
    }

    // critical board — main view at the top of the dashboard
    var critItems=this._critItems();
    var critOpen=critItems.filter(function(it){return critLane(it.note)!=="done";}).length;
    var canManageC=!!this.currentUser();
    out += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 8px;border-bottom:1px solid #f0c9c4;padding-bottom:3px">'+
      '<span class="section-label" style="margin:0;border:none;padding:0;color:var(--error)">Critical items'+(critOpen?' ('+critOpen+' open)':'')+'</span>'+
      '<button class="btn btn-sm" style="min-height:30px;padding:5px 9px;flex:none" data-action="go" data-view="critlist">Full / print &rarr;</button>'+
      '</div>';
    out += '<button class="btn-report" data-action="newcrit"><span class="br-flag">&#9873;</span> Report Critical Issue</button>';
    if(!critItems.length){
      out += '<div class="small muted" style="padding:1px 0 6px">No critical issues right now. Tap Report to add one.</div>';
    } else {
      out += '<div class="small muted no-print" style="margin:0 0 8px;line-height:1.3">'+
        (canManageC?'Drag a card between columns to update it. Tap a card to view or resolve.'
                   :'Tap a card to view details. Log in to move or resolve.')+'</div>';
      out += this._critBoardHtml(critItems);
    }

    // trades — % complete per category (the owner's first question, now on the front page)
    if(tpl.length && rooms.length){
      out += '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 6px;border-bottom:1px solid var(--hairline);padding-bottom:3px">'+
        '<span class="section-label" style="margin:0;border:none;padding:0">Trades — % complete</span>'+
        (this.isAdmin()?'<button class="btn btn-sm" style="min-height:30px;padding:5px 9px;flex:none" data-action="go" data-view="admin">Forecast &rarr;</button>':'')+
        '</div>';
      tpl.forEach(function(task){
        var td=0,tt=0,rc=0; rooms.forEach(function(r){ var u=taskUnits(task,r); td+=u.done; tt+=u.total; if(taskPct(task,r)>=100)rc++; });
        var tp=tt?Math.round(td/tt*100):0;
        out += '<div class="cat-row'+(App.isAdmin()?'" data-action="go" data-view="admin" style="cursor:pointer':'')+'"><div class="cat-head"><span class="cat-name">'+esc(task.name)+'</span><span class="cat-pct">'+tp+'%</span></div>'+
          '<div class="pbar"><div class="pfill'+(tp>=100?' done':'')+'" style="width:'+tp+'%"></div></div>'+
          '<div class="cat-sub">'+rc+' of '+rooms.length+' '+esc(aP.toLowerCase())+' complete</div></div>';
      });
    }

    // managers: new material requests banner
    if(this.isManager()){
      var mnb=this.matNewCount();
      if(mnb){
        out += '<div class="req-banner"><span class="rb-n">'+mnb+'</span>'+
          '<span class="grow small" style="font-weight:600;color:#7a4d10">material '+(mnb===1?"request":"requests")+' waiting for the office</span>'+
          '<button class="btn btn-sm" data-action="go" data-view="materials">Review</button></div>';
      }
    }

    // admin: pending user requests banner
    if(this.isAdmin()){
      var pc=this.pendingUsers().length;
      if(pc){
        out += '<div class="req-banner"><span class="rb-n">'+pc+'</span>'+
          '<span class="grow small" style="font-weight:600;color:#7a4d10">user access '+(pc===1?"request":"requests")+' waiting for you</span>'+
          '<button class="btn btn-sm" data-action="go" data-view="config">Review</button></div>';
      }
    }

    // recently updated tasks
    var recent=this.recentActivity(6);
    if(recent.length || this.isManager()){
      out += '<div style="display:flex;align-items:center;justify-content:space-between;margin:16px 0 6px;border-bottom:1px solid var(--hairline);padding-bottom:3px">'+
        '<span class="section-label" style="margin:0;border:none;padding:0">Recently updated</span>'+
        (this.isManager()?'<button class="btn btn-sm" style="min-height:30px;padding:5px 10px" data-action="go" data-view="log">Full log &rarr;</button>':'')+
        '</div>';
      if(recent.length){
        out += '<div class="recent">';
        recent.forEach(function(a){
          out += '<div class="rc-row" data-action="openroom" data-room="'+esc(a.roomId)+'" style="cursor:pointer"><span class="rc-dot"></span>'+
            '<div class="rc-main"><div class="rc-name">'+esc(a.sub||a.task)+'</div>'+
            '<div class="rc-sub">'+(a.sub?esc(a.task)+' · ':'')+(a.name?esc(a.name):'')+'</div></div>'+
            '<span class="rc-room">'+esc(App.areaS())+' '+esc(a.room)+'</span>'+
            '<span class="rc-when">'+esc(relTime(a.ts))+'</span></div>';
        });
        out += '</div>';
      } else {
        out += '<div class="small muted" style="padding:2px 0 6px">No task activity yet.</div>';
      }
    }

    // filters
    var f=this.filter;
    out += '<div class="toolbar"><div class="seg">'+
      '<button class="'+(f==="all"?"on":"")+'" data-action="filter" data-f="all">All</button>'+
      '<button class="'+(f==="inprogress"?"on":"")+'" data-action="filter" data-f="inprogress">Active</button>'+
      '<button class="'+(f==="notstarted"?"on":"")+'" data-action="filter" data-f="notstarted">Not started</button>'+
      '<button class="'+(f==="complete"?"on":"")+'" data-action="filter" data-f="complete">Done</button>'+
      '<button class="'+(f==="ada"?"on":"")+'" data-action="filter" data-f="ada">ADA</button>'+
      '</div></div>';

    // size + sort controls
    var sz=this.cardSize||"md", sm=this.sortMode||"num";
    out += '<div class="ov-controls">'+
      '<span class="lbl-mini">Size</span><div class="seg">'+
        '<button class="'+(sz==="sm"?"on":"")+'" data-action="setsize" data-s="sm" title="Compact">&#8722;</button>'+
        '<button class="'+(sz==="md"?"on":"")+'" data-action="setsize" data-s="md">Med</button>'+
        '<button class="'+(sz==="lg"?"on":"")+'" data-action="setsize" data-s="lg" title="Detailed">&#43;</button>'+
      '</div>'+
      '<span class="lbl-mini" style="margin-left:auto">Sort</span><div class="seg">'+
        '<button class="'+(sm==="num"?"on":"")+'" data-action="setsort" data-s="num">1&#8211;9</button>'+
        '<button class="'+(sm==="alpha"?"on":"")+'" data-action="setsort" data-s="alpha">A&#8211;Z</button>'+
        '<button class="'+(sm==="pct"?"on":"")+'" data-action="setsort" data-s="pct">%</button>'+
      '</div></div>';

    var shown = rooms.filter(function(r){
      var p=roomPct(tpl,r); var s=roomStatus(p);
      if(f==="all") return true;
      if(f==="ada") return !!r.ada;
      return s===f;
    });
    shown.sort(function(a,b){
      if(sm==="alpha") return String(a.number).localeCompare(String(b.number),undefined,{sensitivity:"base"});
      if(sm==="pct") return roomPct(tpl,a)-roomPct(tpl,b); // least done first
      return String(a.number).localeCompare(String(b.number),undefined,{numeric:true});
    });

    if(shown.length===0){ out += '<div class="empty">No '+esc(aP.toLowerCase())+' match this filter.</div></div>'; return out; }

    if(sz==="sm"){
      out += '<div class="rooms-sm">';
      shown.forEach(function(r){ var p=roomPct(tpl,r);
        out += '<button class="room-tile" data-action="openroom" data-room="'+esc(r.id)+'">'+
          (r.ada?'<span class="tada">ADA</span>':'')+
          '<div class="tnum">'+esc(r.number)+'</div>'+
          '<div class="tbar"><span class="'+(p>=100?'done':'')+'" style="width:'+p+'%"></span></div>'+

  /* ---------- room board ---------- */
  renderRoom:function(){

      return '<div class="wrap"><div class="empty">'+esc(this.areaS())+' not found. It may have been removed, or the link is out of date.</div>'+

    }
    var tpl=this.template(); var p=roomPct(tpl,room); var s=roomStatus(p);
    var out='<div class="wrap'+this._animClass("room")+'">';
    out += '<div class="rb-head"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'+
      '<div><div class="rnum">'+esc(this.areaS())+' '+esc(room.number)+'</div>'+
      '<div class="rmeta" style="margin-top:6px">'+(room.ada?'<span class="badge ada">ADA</span>':'')+
      '<span class="badge '+s+'">'+statusLabel(s)+'</span></div></div>'+
      '<div class="rpct">'+p+'%</div></div>'+
      '<div class="pbar lg"><div class="pfill'+(p>=100?' done':'')+'" style="width:'+p+'%"></div></div></div>';

    // print / PDF room sheet
    out += '<div class="no-print" style="display:flex;margin-top:8px"><button class="btn btn-sm" style="margin-left:auto" data-action="go" data-view="roomsheet">Room sheet (PDF)</button></div>';

    // login banner (guest = read-only) / provisional reassurance
    var cu=this.currentUser();
    if(!cu){
      out += '<div class="login-banner"><span class="lb-txt">You’re viewing as a guest. Log in with your password to check off work, add photos or notes.</span>'+
        '<button class="btn btn-primary btn-sm" data-action="login">Log in</button></div>';
    } else if(cu.provisional){
      out += '<div class="login-banner"><span class="lb-txt">You’re working while the office confirms your login — go ahead, everything you do is saved and credited to you.</span></div>';
    }

    // tabs
    var tab=this.tab; if(tab==="schedule"||tab==="map") tab="tasks"; // schedule + map tabs retired
    var critN=(room.notes||[]).filter(function(n){return n.critical && critLane(n)!=="done";}).length;
    var noteN=(room.notes||[]).filter(function(n){return !n.critical;}).length;
    out += '<div class="tabs">'+
      '<button class="'+(tab==="tasks"?"on":"")+'" data-action="tab" data-tab="tasks">Tasks</button>'+
      '<button class="'+(tab==="photos"?"on":"")+'" data-action="tab" data-tab="photos">Photos'+(room.photos&&room.photos.length?" ("+room.photos.length+")":"")+'</button>'+
      '<button class="'+(tab==="notes"?"on":"")+'" data-action="tab" data-tab="notes">Notes'+(noteN?" ("+noteN+")":"")+'</button>'+
      '<button class="'+(tab==="critical"?"on":"")+'" data-action="tab" data-tab="critical">Critical'+(critN?" ("+critN+")":"")+'</button>'+
      '<button class="'+(tab==="history"?"on":"")+'" data-action="tab" data-tab="history">History</button>'+
      '</div>';

    if(tab==="tasks") out += this.renderTasks(room,tpl);
    else if(tab==="photos") out += this.renderPhotos(room);
    else if(tab==="notes") out += this.renderNotes(room);
    else if(tab==="critical") out += this.renderRoomCritical(room);
    else if(tab==="history") out += this.renderRoomHistory(room);
    else if(tab==="map") out += this.renderMapContent();

    out += '</div>';

  renderTasks:function(room,tpl){
    if(!tpl.length) return '<div class="empty">No tasks defined yet. Add a task template in Config.</div>';
    var opens = this._openTasks || {};
    var out='<div style="margin-top:4px">';
    tpl.forEach(function(task){
      var u=taskUnits(task,room); var pct=u.total?Math.round(u.done/u.total*100):0;
      var isOpen = opens[task.id]!==false; // default open
      out += '<div class="task'+(isOpen?' open':'')+'" data-tid="'+esc(task.id)+'">'+
        '<div class="task-head" data-action="toggletask" data-tid="'+esc(task.id)+'">'+
          '<span class="caret">&#9656;</span>'+
          '<span class="tname">'+esc(task.name)+'</span>'+
          '<span class="tpct">'+u.done+'/'+u.total+' · '+pct+'%</span>'+
        '</div>'+
        '<div class="pbar"><div class="pfill'+(pct>=100?' done':'')+'" style="width:'+pct+'%"></div></div>';
      if(task.subs && task.subs.length){
        out += '<div class="subs">';
        task.subs.forEach(function(sub){
          out += App.subRow(room, sub.id, sub.name);
        });
        out += '</div>';
      } else {
        out += '<div class="subs">'+App.subRow(room, task.id, "Mark task complete")+'</div>';
      }
      out += '</div>';
    });
    out += '</div>';
    return out;
  },

  /* one checklist row with breadcrumb + editable completion date */
  subRow:function(room, key, labelHtml){
    var v = room.done && room.done[key];
    var on = !!v; var meta = doneMeta(v);
    var crumb="";
    if(on){
      var who = meta.name ? '<span class="who">'+esc(meta.name)+(meta.company?" ("+esc(meta.company)+")":"")+'</span>' : '<span class="who muted">completed</span>';
      var dateHtml;
      if(this._editDate===key){
        dateHtml = '<input type="date" class="date-edit" data-action="setdate" data-key="'+esc(key)+'" value="'+esc(meta.date||todayISO())+'">';
      } else {
        var dlabel = meta.date ? fmtDate(meta.date) : "set date";
        dateHtml = '<button class="datebtn" data-action="editdate" data-key="'+esc(key)+'">'+esc(dlabel)+'</button>';
      }
      // exact time the box was checked + how long ago (only when we have a timestamp)
      var stampHtml = meta.ts ? '<span class="chk-stamp" title="Checked '+esc(fmtDateTime(meta.ts))+'">'+esc(fmtClock(meta.ts))+' · '+esc(relTime(meta.ts))+'</span>' : '';
      crumb = '<span class="crumb">'+who+' · '+dateHtml+(stampHtml?' · '+stampHtml:'')+'</span>';
    }
    var att=this.attachmentsFor(room, key); var acount=att.photos.length+att.notes.length;
    var cam='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8h3.5l1.5-2h6l1.5 2H20v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>';
    var attachBtn='<button class="attach-btn'+(acount?' has':'')+'" data-action="attach" data-key="'+esc(key)+'" data-name="'+esc(labelHtml)+'" title="Add photo or note">'+cam+(acount?'<span>'+acount+'</span>':'')+'</button>';
    return '<div class="chk'+(on?' on':'')+'" data-action="togglesub" data-sub="'+esc(key)+'">'+
      '<span class="box'+(on?' on':'')+'"></span>'+
      '<span class="cname"><span class="lead">'+esc(labelHtml)+'</span>'+crumb+'</span>'+
      attachBtn+'</div>';
  },
  /* photos + notes attached to a specific task/subtask key in a room */
  attachmentsFor:function(room, key){
    var ph=(room.photos||[]).filter(function(p){return p.taskKey===key;});
    var nt=(room.notes||[]).filter(function(n){return n.taskKey===key;});
    return {photos:ph, notes:nt};
  },

  renderPhotos:function(room){
    var photos=room.photos||[];
    var out='<div style="margin-top:8px">';
    out += '<label class="photo-slot" style="display:block">'+
      '<input type="file" accept="image/*" capture="environment" style="display:none" id="photoInput" multiple>'+
      '&#9673; Tap to add a photo (camera or library)</label>';

        var cap = (ph.taskName?esc(ph.taskName)+" · ":"")+(ph.byName ? (esc(ph.byName)+(ph.when?" · "+esc(fmtDate((ph.when||"").slice(0,10))):"")) : "");

  renderNotes:function(room){

  /* room History tab: chronological breadcrumb feed — who did what, when, how long ago */
  renderRoomHistory:function(room){
    var evs=this.roomFeed(room);
    var out='<div style="margin-top:8px">';
    if(!evs.length){ out+='<div class="empty">No history for this '+esc(this.areaS().toLowerCase())+' yet. Check off a task or add a photo and it shows up here.</div></div>'; return out; }
    out+='<div class="small muted" style="margin-bottom:4px">Everything that happened in this '+esc(this.areaS().toLowerCase())+' — newest first ('+evs.length+' event'+(evs.length===1?'':'s')+').</div>';
    var lastDay=null; var today=todayISO(); var yest=tsYMD(Date.now()-86400000);
    evs.forEach(function(e){
      var d=tsYMD(e.ts);
      if(d!==lastDay){ lastDay=d; var lab=(d===today)?"Today":((d===yest)?"Yesterday":fmtDate(d));
        out+='<div class="hist-day">'+esc(lab)+'</div>'; }
      out+='<div class="hist-row"><span class="rc-dot" style="background:'+logColor(e.type)+'"></span>'+
        '<div class="hist-main"><div class="hist-text">'+esc(e.text)+'</div>'+
        '<div class="hist-meta">'+(e.who?'<b>'+esc(e.who)+'</b>'+(e.whoCo?' ('+esc(e.whoCo)+')':'')+' · ':'')+esc(fmtClock(e.ts))+' · '+esc(relTime(e.ts))+'</div></div></div>';
    });
    out+='</div>';
    return out;
  },
  /* room Critical tab: report a critical (photos + assignment) and manage this room's items */
  renderRoomCritical:function(room){
    var crit=(room.notes||[]).filter(function(n){return n.critical;}).slice().sort(function(a,b){
      var ad=critLane(a)==="done"?1:0, bd=critLane(b)==="done"?1:0; if(ad!==bd) return ad-bd; return (b.ts||0)-(a.ts||0);
    });
    var out='<div style="margin-top:8px">';
    out += '<button class="btn btn-primary btn-block btn-sm" data-action="newcrit">+ Report critical issue</button>';
    out += '<div class="small muted" style="margin:7px 0 6px">Add the issue with photos'+(this.isManager()?' and assign it to someone':'')+'. Tap an item to update it, add fix photos, or mark it resolved.</div>';
    if(!crit.length){ out += '<div class="empty">No critical issues for this '+esc(this.areaS().toLowerCase())+' yet.</div></div>'; return out; }
    crit.forEach(function(n){
      var lane=critLane(n);
      var laneLbl=lane==="done"?"Resolved":(lane==="inprogress"?"In progress":"New");
      var laneCls=lane==="done"?"done":(lane==="inprogress"?"prog":"new");
      var thumbs=''; (n.issuePhotos||[]).concat(n.fixPhotos||[]).slice(0,4).forEach(function(ph){ thumbs+='<img src="'+esc(ph.url)+'" alt="" data-action="viewphoto" data-url="'+esc(ph.url)+'" style="width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--hairline);cursor:zoom-in">'; });
      out += '<div class="rc-crit '+laneCls+'" data-action="managecrit" data-room="'+esc(room.id)+'" data-nid="'+esc(n.id)+'">'+
        '<div class="rcc-top"><span class="rcc-lane '+laneCls+'">'+laneLbl+'</span>'+
          (n.assignedName?'<span class="rcc-asg"><span class="rcc-av">'+esc(initials(n.assignedName))+'</span>'+esc(n.assignedName)+'</span>':'<span class="rcc-asg un">Unassigned</span>')+
          '<span class="rcc-when">'+esc(relTime(n.ts))+'</span></div>'+
        '<div class="rcc-text">'+esc(n.text)+'</div>'+
        (thumbs?'<div style="display:flex;gap:5px;margin-top:6px;flex-wrap:wrap">'+thumbs+'</div>':'')+
        (n.reply?'<div class="crit-reply" style="margin-top:6px"><span class="who">Fix'+(n.replyBy?" ("+esc(n.replyBy)+")":"")+':</span> '+esc(n.reply)+'</div>':'')+
        '</div>';
    });
    out += '</div>';
    return out;
  },

  /* ---------- activity log ---------- */
  renderLog:function(){
    var f=this.logFilter||(this.logFilter={room:"",person:"",task:"",sub:"",from:"",to:""});
    var aS=this.areaS(); var tpl=this.template();
    var logs=this.projectLogs();
    var comps=this.recentActivity(); // structured check-offs: room/task/sub/name/ts
    // filter option lists
    var roomOpts=this.roomList().map(function(r){ return String(r.number); });
    var pset={}; logs.forEach(function(e){ if(e.actorName&&e.actorName!=="(guest)") pset[e.actorName]=1; });
    comps.forEach(function(c){ if(c.name) pset[c.name]=1; });
    var people=Object.keys(pset).sort();
    var taskSel=tpl.filter(function(t){ return t.name===f.task; })[0];
    var subOpts=taskSel?(taskSel.subs||[]).map(function(s){ return s.name; }):[];
    var taskMode=!!(f.task||f.sub);
    function inDate(ts){ var d=tsYMD(ts); if(f.from&&d<f.from) return false; if(f.to&&d>f.to) return false; return true; }
    // build rows
    var rows=[];
    if(taskMode){
      comps.forEach(function(c){
        if(f.room && String(c.room)!==f.room) return;
        if(f.person && c.name!==f.person) return;
        if(f.task && c.task!==f.task) return;
        if(f.sub && c.sub!==f.sub) return;
        if(!inDate(c.ts)) return;
        rows.push({dot:"var(--accent)", text:'Completed "'+(c.sub||c.task)+'"'+(c.sub?' — '+c.task:''), who:(c.name?c.name+(c.company?' · '+c.company:''):''), room:String(c.room), ts:c.ts});
      });
    } else {
      logs.forEach(function(e){
        if(f.room && e.room!==aS+" "+f.room) return;
        if(f.person && e.actorName!==f.person) return;
        if(!inDate(e.ts)) return;
        rows.push({dot:logColor(e.type), text:e.text, who:(e.actorName&&e.actorName!=="(guest)")?(e.actorName+(e.actorCompany?' · '+e.actorCompany:'')):'', room:e.room?e.room.replace(aS+" ",""):'', ts:e.ts});
      });
    }
    var hasFilter=!!(f.room||f.person||f.task||f.sub||f.from||f.to);
    var shown=rows.slice(0,300);
    function opts(list, cur){ return '<option value="">All</option>'+list.map(function(n){ return '<option value="'+esc(n)+'"'+(cur===n?' selected':'')+'>'+esc(n)+'</option>'; }).join(''); }
    var out='<div class="wrap">';
    // filter card
    out+='<div class="logf">'+
      '<div class="row-2">'+
        '<div class="field"><label class="lbl">'+esc(aS)+'</label><select class="in" id="logFRoom">'+opts(roomOpts,f.room)+'</select></div>'+
        '<div class="field"><label class="lbl">Person</label><select class="in" id="logFPerson">'+opts(people,f.person)+'</select></div></div>'+
      '<div class="row-2">'+
        '<div class="field"><label class="lbl">Task</label><select class="in" id="logFTask">'+opts(tpl.map(function(t){return t.name;}),f.task)+'</select></div>'+
        '<div class="field"><label class="lbl">Subtask</label><select class="in" id="logFSub"'+(f.task?'':' disabled')+'>'+opts(subOpts,f.sub)+'</select></div></div>'+
      '<div class="row-2">'+
        '<div class="field"><label class="lbl">From</label><input type="date" class="in" id="logFFrom" value="'+esc(f.from)+'"></div>'+
        '<div class="field"><label class="lbl">To</label><input type="date" class="in" id="logFTo" value="'+esc(f.to)+'"></div></div>'+
      (hasFilter?'<button class="btn btn-sm btn-block" data-action="clearlogf">Clear filters</button>':'')+
      '</div>';
    out+='<div class="small muted" style="margin:8px 0">'+
      (taskMode?'Showing check-offs for your task filter — ':'')+
      'Showing '+shown.length+(rows.length>shown.length?' of '+rows.length:'')+' '+(taskMode?'check-off':'event')+(rows.length===1?'':'s')+', newest first.</div>';
    if(!rows.length){ out+='<div class="empty">Nothing matches these filters.</div></div>'; return out; }
    out += '<div class="recent">';
    shown.forEach(function(r){
      out += '<div class="rc-row"'+(r.room?' data-action="openroomnum" data-num="'+esc(r.room)+'" style="cursor:pointer"':'')+'>'+
        '<span class="rc-dot" style="background:'+r.dot+'"></span>'+
        '<div class="rc-main"><div class="rc-name">'+esc(r.text)+'</div>'+
        '<div class="rc-sub">'+[r.who?esc(r.who):null, r.room?esc(aS)+' '+esc(r.room):null].filter(Boolean).join(' · ')+'</div></div>'+
        '<span class="rc-when" title="'+esc(fmtDateTime(r.ts))+'">'+esc(relTime(r.ts))+'</span></div>';
    });
    out += '</div></div>';
    return out;
  },

  renderProjects:function(){

  /* ---------- printable punch list ---------- */
  renderPunchList:function(){
    var tpl=this.template(); var rooms=this.roomList(); var showAll=!!this.punchAll;
    var job=(this.config&&this.config.job)||{}; var aS=this.areaS();
    var out='<div class="wrap">';
    out+='<div class="sheet-tools no-print" style="display:flex;gap:8px;align-items:center;margin-bottom:10px">'+
      '<button class="btn btn-sm" data-action="punchtoggle">'+(showAll?'Showing: every task':'Showing: remaining only')+'</button>'+
      '<button class="btn btn-primary btn-sm" data-action="print" style="margin-left:auto">Print</button></div>';
    out+='<div class="print-sheet"><div class="ps-head"><div class="ps-title">'+esc(job.name||'El Dorado')+' &mdash; Punch list</div>'+
      '<div class="ps-sub">'+(job.number?'Job '+esc(job.number)+' &middot; ':'')+esc(new Date().toLocaleDateString())+' &middot; '+(showAll?'all tasks':'remaining items only')+'</div></div>';
    var any=false;
    rooms.forEach(function(r){
      var pct=roomPct(tpl,r);
      if(!showAll && pct>=100) return;
      var blocks='';
      tpl.forEach(function(task){
        var items=(task.subs&&task.subs.length)?task.subs:[{id:task.id,name:task.name}];
        var rem=items.filter(function(s){ return showAll || !(r.done&&r.done[s.id]); });
        if(!rem.length) return;
        var lines=rem.map(function(s){ var done=r.done&&r.done[s.id]; return '<div class="ps-item"><span class="ps-box'+(done?' on':'')+'"></span>'+esc(s.name)+'</div>'; }).join('');
        blocks+='<div class="ps-task"><div class="ps-taskname">'+esc(task.name)+'</div>'+lines+'</div>';
      });
      if(!blocks) return;
      any=true;
      out+='<div class="ps-room"><div class="ps-roomhead"><span class="ps-roomnum">'+esc(aS)+' '+esc(r.number)+'</span>'+(r.ada?'<span class="ps-ada">ADA</span>':'')+'<span class="ps-pct">'+pct+'% done</span></div>'+blocks+'</div>';
    });
    if(!any) out+='<div class="empty">Nothing remaining &mdash; every '+esc(aS.toLowerCase())+' is complete.</div>';
    out+='</div></div>';
    return out;
  },

      '<button class="btn btn-primary btn-sm" data-action="critpdf" style="margin-left:auto">Export PDF</button></div>';

                :'Tap a card to see details. Log in to move, assign, or resolve. ')+

    if(!items.length){
      out+='<div class="empty no-print">No critical items yet. Tap “Report critical” to add one.</div>';

  /* admin-only: category % complete + momentum/forecast */
  renderAdmin:function(){
    if(!this.isAdmin()){ return '<div class="wrap"><div class="empty">This dashboard is for the office (admin) only.</div><button class="btn btn-primary btn-block" data-action="go" data-view="overview">Back to board</button></div>'; }
    var aP=this.areaP().toLowerCase(); var aS=this.areaS().toLowerCase(); var st=this.projectStats();
    function areaN(n){ return n+" "+(n===1?aS:aP); }
    var out='<div class="wrap">';
    if(!st.N){ out+='<div class="empty">No '+esc(aP)+' yet — add some in Config to see progress.</div></div>'; return out; }
    if(!st.tasks.length){ out+='<div class="empty">No task template yet — set one up in Config.</div></div>'; return out; }
    var overallDone=0, overallTotal=0; st.tasks.forEach(function(t){ overallDone+=t.doneUnits; overallTotal+=t.totalUnits; });
    var overallPct=overallTotal?Math.round(overallDone/overallTotal*100):0;
    var driver=null; st.tasks.forEach(function(t){ if(t.daysLeft!=null && t.remainingUnits>0){ if(!driver || t.daysLeft>driver.daysLeft) driver=t; } });
    // headline
    var head='';
    if(overallPct>=100){ head='Every task is complete — nice work.'; }
    else if(driver){ var ef=estFinish(driver.daysLeft); head='At the current pace, <b>'+esc(driver.name)+'</b> is the long pole — about <b>'+driver.daysLeft+' working day'+(driver.daysLeft===1?'':'s')+'</b> left'+(ef?' (est. finish ~'+esc(ef)+')':'')+'.'; }
    else { head='Check off some work first — I need a bit of history to forecast a finish date.'; }
    out+='<div class="summary"><div class="sub">'+esc(this.projName())+' — overall</div><div class="big">'+overallPct+'%</div>'+
      '<div class="pbar lg"><div class="pfill'+(overallPct>=100?' done':'')+'" style="width:'+overallPct+'%"></div></div>'+
      '<div class="sub" style="margin-top:9px;line-height:1.4">'+head+'</div></div>';

    // ---- at-a-glance stat tiles ----
    var rs=this.roomStats();
    var fx=this._forecastStats(st, rs);
    function tile(k,v,sub,col){ return '<div class="stat-card"><div class="stat-k">'+k+'</div><div class="stat-v"'+(col?' style="color:'+col+'"':'')+'>'+v+'</div><div class="stat-s">'+sub+'</div></div>'; }
    out+='<div class="statgrid">'+
      tile('This week', fx.last7+' step'+(fx.last7===1?'':'s'), (fx.prev7||fx.last7)?((fx.wkDelta>=0?'+':'')+fx.wkDelta+' vs last week'):'no history yet')+
      tile('Pace', fx.rate14?('~'+fmtRate(fx.rate14)+'/day'):'—', fx.act14+' active day'+(fx.act14===1?'':'s')+' in last 14')+
      tile('Projected finish', fx.remainAll<=0?'Done':(fx.projD?('~'+fmtMD(fx.projD)):'—'), fx.remainAll<=0?'every step complete':(fx.projD?'all work, at the 14-day pace':'need a bit more history'))+
      tile('At risk', String(fx.roomRisk+fx.taskRisk), fx.roomRisk+' '+esc(aP)+' · '+fx.taskRisk+' task'+(fx.taskRisk===1?'':'s'), (fx.roomRisk+fx.taskRisk)?'#c23b2e':'#2e7d4f')+
      '</div>';
    // ---- export to email ----
    out+='<button class="btn btn-block" style="margin-top:8px" data-action="admemail">Copy email report</button>';
    if(this._admEmailSubject) out+='<a class="btn btn-sm btn-block" style="margin-top:6px;display:block;text-align:center;text-decoration:none" href="mailto:?subject='+encodeURIComponent(this._admEmailSubject).replace(/"/g,"%22")+'">Open a blank email to paste into</a>';
    out+='<div class="small muted" style="margin-top:4px;text-align:center">Copies the whole forecast — overview, task table and '+esc(aS)+' table — to paste straight into an email.</div>';

    // ---- category % complete ----
    out+='<div class="section-label">Categories — % complete</div>';
    st.tasks.forEach(function(t){
      out+='<div class="cat-row"><div class="cat-head"><span class="cat-name">'+esc(t.name)+'</span><span class="cat-pct">'+t.pct+'%</span></div>'+
        '<div class="pbar"><div class="pfill'+(t.pct>=100?' done':'')+'" style="width:'+t.pct+'%"></div></div>'+
        '<div class="cat-sub">'+t.roomsComplete+' of '+t.roomsTotal+' '+esc(aP)+' complete · '+t.doneUnits+'/'+t.totalUnits+' steps done</div></div>';
    });

    // ---- momentum / forecast ----
    out+='<div class="section-label">Momentum &amp; forecast</div>';
    out+='<div class="small muted" style="margin-bottom:8px">Based on how many were completed per working day so far. The more work logged, the better the estimate.</div>';
    st.tasks.forEach(function(t){
      if(t.remainingUnits<=0){ out+='<div class="mo-task"><div class="mo-th"><span class="mo-name">'+esc(t.name)+'</span><span class="mo-eta done">Complete</span></div></div>'; return; }
      var eta=(t.daysLeft!=null)?('~'+t.daysLeft+' working day'+(t.daysLeft===1?'':'s')+' left'+(t.rate?' · ~'+fmtRate(t.rate)+'/day':'')):'No pace yet';
      out+='<div class="mo-task"><div class="mo-th"><span class="mo-name">'+esc(t.name)+'</span><span class="mo-eta">'+eta+'</span></div>';
      if(t.hasSubs){
        t.subs.forEach(function(s){

        });
      }

    });

    // ---- critical scoreboard (people analytics live here now) ----
    var sc=this.critScores();

    // ---- daily completions by person ----

    var dchart=this._chartDaily();

    out+='<div class="section-label">Schedule — tasks</div>';
    out+='<div class="small muted" style="margin-bottom:4px">Each task: solid = work done so far, light = projected finish at the current pace. Red tick = the deadline you set in Config.</div>';
    out+=this._zoomChips("t", this.ganttZoomT||"auto");
    out+=this._chartGantt(st, this.ganttZoomT||"auto");

    // ---- room deadline report + room-by-room gantt ----
    out+='<div class="section-label">Deadline check — '+esc(aP)+'</div>';
    out+=this._deadlineReport(rs);
    out+='<div class="section-label">Schedule — '+esc(aP)+'</div>';
    out+='<div class="small muted" style="margin-bottom:6px">One row per '+esc(aS)+', forecast at that '+esc(aS)+'&rsquo;s own pace. Red tick = its deadline; a red forecast bar means it won&rsquo;t make it at the current speed.</div>';
    var sm=this.roomSort||"risk";
    out+='<div class="sortchips">'+
      '<button class="sc-btn'+(sm==="risk"?' on':'')+'" data-action="roomsort" data-s="risk">At risk first</button>'+
      '<button class="sc-btn'+(sm==="deadline"?' on':'')+'" data-action="roomsort" data-s="deadline">By deadline</button>'+
      '<button class="sc-btn'+(sm==="number"?' on':'')+'" data-action="roomsort" data-s="number">By number</button></div>';
    out+=this._zoomChips("r", this.ganttZoomR||"auto");
    out+=this._chartRoomGantt(rs, this.ganttZoomR||"auto");

    out+='</div>';
    return out;
  },

  /* all critical notes across rooms, newest first: [{roomId, room, note}] */
  _critItems:function(){
    var items=[];
    this.roomList().forEach(function(r){ (r.notes||[]).forEach(function(n){ if(n.critical){ items.push({roomId:r.id, room:r.number, note:n}); } }); });
    items.sort(function(a,b){ return (b.note.ts||0)-(a.note.ts||0); });
    return items;
  },
  /* per-person critical scoreboard: fixed (resolved) drives the ranking */
  critScores:function(){
    var people={}, order=[], unassignedOpen=0;
    this.roomList().forEach(function(r){ (r.notes||[]).forEach(function(n){
      if(!n.critical) return;
      var isDone=critLane(n)==="done";
      var id=n.assignedId||"", nm=n.assignedName||"";
      if(!id && !nm){ if(!isDone) unassignedOpen++; return; }
      var key=id||("nm:"+nm);
      if(!people[key]){ people[key]={name:nm, open:0, done:0}; order.push(key); }
      if(isDone) people[key].done++; else people[key].open++;
    }); });
    var list=order.map(function(k){return people[k];});
    list.sort(function(a,b){ if(b.done!==a.done) return b.done-a.done; if(b.open!==a.open) return b.open-a.open; return String(a.name).localeCompare(String(b.name)); });
    return {list:list, unassignedOpen:unassignedOpen};
  },

  /* make a QR <img> from text (vendored qrcode-generator, no CDN needed) */
  qrImg:function(text, sizePx){
    var qr=qrcode(0,"M"); qr.addData(text); qr.make();
    var count=qr.getModuleCount();
    var cell=Math.max(2, Math.round(sizePx/(count+8))); // ~4-module quiet zone each side
    var img=new Image();
    img.src=qr.createDataURL(cell, cell*4);
    img.width=sizePx; img.height=sizePx; img.alt="QR code";
    img.style.imageRendering="pixelated";
    return img;
  },

  /* build QR into label slots after render */
  bindTemplateAutoQR:function(){
    if(this.view!=="labels") return;
    var slots=document.querySelectorAll(".qrslot");
    slots.forEach(function(slot){
      var rid=slot.getAttribute("data-room");
      slot.innerHTML="";
      try{ slot.appendChild(App.qrImg(App.roomURL(rid),150)); }
      catch(e){ slot.textContent="QR error"; }

  /* ============================================================
     EVENT HANDLING (delegated)
     ============================================================ */
  handle:function(e){
    var t=e.target.closest("[data-action]");
    // lightbox backdrop click (only when the press started on the backdrop too)
    if(e.type==="click" && this._downOnBg && e.target.classList && e.target.classList.contains("lightbox")){ this.closeLightbox(); return; }
    // modal backdrop click (only when the press started on the backdrop too)
    if(e.type==="click" && this._downOnBg && e.target.classList && e.target.classList.contains("modal-bg")){ this.closeModal(); return; }
    if(!t) return;
    var a=t.getAttribute("data-action");
    var room = this.roomId ? this.rooms[this.roomId] : null;

    switch(a){
      case "go":
        var gv=t.getAttribute("data-view");
        if(gv==="config" && !this.canOpenConfig()){ this.openLogin(true); break; }
        this.go(gv); break;
      case "openroom": this.go("room", t.getAttribute("data-room")); break;
      case "navtab":
        var ntb=t.getAttribute("data-t");
        if(ntb==="board"){ if(this.view!=="overview") this.go("overview"); }
        else if(ntb==="critical"){ if(this.view!=="critlist") this.go("critlist"); }
        else if(ntb==="map"){ if(this.view!=="map") this.go("map"); }
        else { this.modal={type:"morenav"}; this.render(); }
        break;
      case "gomore":
        var gmv=t.getAttribute("data-view");
        this.closeModal(); this.modal=null;
        if(gmv==="config" && !this.canOpenConfig()){ this.openLogin(true); break; }
        this.go(gmv); break;
      case "viewphoto": this.openLightbox(t.getAttribute("data-url")); break;
      case "closelight": this.closeLightbox(); break;
      case "openroomnum":
        var rnum=t.getAttribute("data-num"); var rm=this.roomList().filter(function(x){return String(x.number)===String(rnum);})[0];
        if(rm) this.go("room", rm.id); break;
      case "firstsetup": this.modal={type:"newproject", sing:"Room", plur:"Rooms", msg:null}; this.render(); break;

      /* projects */
