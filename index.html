<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Dorado — Room Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1b2733; --steel:#3d4854; --accent:#2e7d4f; --accent-ink:#fff;
  --bg:#f4f5f6; --ink:#14181c; --muted:#5b6773; --line:#aeb6bd; --hairline:#dfe2e5;
  --error:#c23b2e; --ok:#2e7d4f; --amber:#e8842c;
  --radius:8px;
  --shadow-btn:0 1.5px 3px rgba(20,24,28,.25);
  --shadow-input:0 1px 1.5px rgba(20,24,28,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);font-family:Barlow,sans-serif;color:var(--ink);font-size:14px;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent)}

/* App header (dark) */
.app-header{background:var(--navy);color:#fff;padding:10px 12px;position:sticky;top:0;z-index:20}
.app-header .job-meta{font-size:11px;color:#8fa1b3;font-weight:500;line-height:1.3}
.app-header .title{font-family:'Barlow Semi Condensed',sans-serif;font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.15;margin-top:1px}
.hdr-row{display:flex;align-items:center;gap:10px}
.hdr-row .grow{flex:1;min-width:0}
.hdr-btn{flex:none;background:#33465a;border:1px solid #435872;color:#fff;min-height:36px;padding:7px 11px;border-radius:var(--radius);font-family:'Barlow Semi Condensed',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.hdr-btn.icon{padding:7px 12px;min-width:46px;min-height:40px;font-size:16px}
.hdr-btn:active{background:#3d5268}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:20px;margin-top:6px}
.pill .dot{width:7px;height:7px;border-radius:50%}
.pill.online{background:#173a28;color:#7fd6a3}.pill.online .dot{background:#3ddc84}
.pill.local{background:#3a2f17;color:#e8c07f}.pill.local .dot{background:var(--amber)}

/* Layout */
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 96px}
.section-label{font-family:'Barlow Semi Condensed',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);margin:16px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--hairline)}
.section-label:first-child{margin-top:4px}
.muted{color:var(--muted)}
.small{font-size:11.5px}

/* Buttons */
.btn{min-height:44px;padding:10px 14px;border-radius:var(--radius);font-family:inherit;font-size:13px;text-transform:uppercase;letter-spacing:.03em;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800;box-shadow:var(--shadow-btn)}
.btn-danger{background:#fff;border-color:var(--error);color:var(--error)}
.btn-sm{min-height:36px;padding:7px 11px;font-size:12px}
.btn:disabled{background:var(--bg);border-color:var(--hairline);color:var(--muted);box-shadow:none}
.btn-block{display:block;width:100%}

/* Inputs */
.lbl{display:block;font-family:'Barlow Semi Condensed',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);margin:0 0 3px}
.in{width:100%;min-height:38px;padding:8px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;font:inherit;font-size:14px;color:var(--ink);box-shadow:var(--shadow-input)}
textarea.in{min-height:64px;resize:vertical}
.in:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:-1px}
.field{margin-bottom:10px}
.row-2{display:flex;gap:8px}.row-2>*{flex:1}

/* Badges */
.badge{display:inline-block;padding:3px 7px;border-radius:var(--radius);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.badge.ada{background:#0d4f8b;color:#fff}
.badge.notstarted{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.badge.inprogress{background:var(--accent);color:#fff}
.badge.complete{background:var(--steel);color:#fff}

/* Room cards (overview) */
.rooms-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:560px){.rooms-grid{grid-template-columns:1fr 1fr 1fr}}
.room-card{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow-input);text-align:left}
.room-card:active{border-color:var(--accent)}
.room-card .rnum{font-family:'Barlow Semi Condensed',sans-serif;font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.room-card .rtop{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.room-card .rpct{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:15px}
.room-card .rmeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}

/* Progress bar */
.pbar{height:8px;background:var(--bg);border:1px solid var(--hairline);border-radius:var(--radius);overflow:hidden;margin-top:8px}
.pfill{height:100%;background:var(--accent);width:0%}
.pfill.done{background:var(--steel)}
.pbar.lg{height:12px}

/* Overview summary */
.summary{background:var(--navy);color:#fff;border-radius:var(--radius);padding:12px;margin-bottom:4px}
.summary .big{font-family:'Barlow Semi Condensed',sans-serif;font-size:30px;font-weight:700;line-height:1}
.summary .sub{font-size:11px;color:#8fa1b3;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.summary .pbar{background:#33465a;border-color:#435872;margin-top:10px}
/* dashboard overall progress pinned under the header */
.summary.stick{position:sticky;top:var(--hdrh,84px);z-index:15;margin-bottom:12px;box-shadow:0 3px 8px rgba(20,24,28,.22)}
.summary.stick .big{transition:font-size .15s}
.summary.stick .stat-row{overflow:hidden;max-height:60px;transition:max-height .2s,margin-top .2s}
body.scrolled .summary.stick{padding:8px 12px}
body.scrolled .summary.stick .big{font-size:20px}
body.scrolled .summary.stick .stat-row{max-height:0;margin-top:0}
.stat-row{display:flex;gap:8px;margin-top:10px}
.stat{flex:1;background:#233242;border:1px solid #33465a;border-radius:var(--radius);padding:7px 9px}
.stat .n{font-family:'Barlow Semi Condensed',sans-serif;font-size:18px;font-weight:700}
.stat .t{font-size:9.5px;color:#8fa1b3;text-transform:uppercase;letter-spacing:.05em;font-weight:600}

/* Toolbar / filters */
.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:12px 0 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff}
.seg button{background:#fff;border:none;border-right:1px solid var(--hairline);color:var(--steel);font-family:'Barlow Semi Condensed',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;min-height:36px}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff}

/* Room board */
.rb-head{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow-input)}
.rb-head .rnum{font-family:'Barlow Semi Condensed',sans-serif;font-size:22px;font-weight:700;text-transform:uppercase}
.rb-head .rpct{font-family:'Barlow Semi Condensed',sans-serif;font-size:22px;font-weight:700}

/* Task rows */
.task{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);margin-top:8px;overflow:hidden}
.task-head{display:flex;align-items:center;gap:10px;padding:10px}
.task-head .tname{flex:1;font-weight:700;font-size:14px}
.task-head .tpct{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:13px;color:var(--steel)}
.task-head .caret{width:16px;text-align:center;color:var(--muted);font-size:12px;transition:transform .12s}
.task.open .caret{transform:rotate(90deg)}
.task .pbar{margin:0 10px 10px}
.subs{border-top:1px solid var(--hairline);display:none}
.task.open .subs{display:block}
.chk{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--hairline);font-size:13px;font-weight:500}
.chk:last-child{border-bottom:none}
.chk .box{width:22px;height:22px;flex:none;border:1.5px solid var(--line);border-radius:var(--radius);background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:transparent}
.chk .box.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk .box.on::after{content:"\2713"}
.chk .cname{flex:1}
.chk.on .cname{color:var(--muted);text-decoration:line-through}

/* Tabs */
.tabs{display:flex;margin:12px 0 0;border-bottom:1px solid var(--hairline)}
.tabs button{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'Barlow Semi Condensed',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:9px 4px;min-height:40px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

/* Photos */
.photo-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--hairline);border-radius:var(--radius)}
.photo-slot{border:1px dashed #8f99a3;border-radius:var(--radius);padding:16px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);background:#fff}
.thumb{position:relative}
.thumb .del{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:var(--radius);background:rgba(20,24,28,.72);color:#fff;border:none;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}

/* Notes */
.note{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:9px 10px;margin-top:6px}
.note .meta{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:2px}
.note .txt{font-size:13px;white-space:pre-wrap}
.note .del{float:right;background:none;border:none;color:var(--error);font-size:11px;font-weight:700;text-transform:uppercase}

/* Config template editor */
.cfg-task{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:10px;margin-top:8px}
.cfg-task .ct-head{display:flex;gap:6px;align-items:center}
.cfg-sub{display:flex;gap:6px;align-items:center;margin-top:6px;padding-left:14px}
.icon-btn{flex:none;width:36px;height:36px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--steel);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center}
.icon-btn.danger{color:var(--error);border-color:var(--line)}
.icon-btn:disabled{opacity:.3;cursor:default}
.cfg-room{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:8px;margin-top:6px}
.cfg-room .rn{flex:1}
.cfg-dl{flex:none;width:auto;max-width:132px;padding:5px 6px;font-size:12px;color:#8b97a3}
.cfg-dl.has-dl{color:#c23b2e;font-weight:700;border-color:#e6b9b4}
.ct-dl{display:flex;gap:6px;align-items:center;margin-top:6px}
.ct-dl-lbl{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#8b97a3;flex:none}
.sortchips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px}
.sc-btn{border:1px solid var(--hairline);background:#fff;border-radius:99px;padding:5px 11px;font:inherit;font-size:12px;font-weight:700;color:#5b6773;cursor:pointer}
.sc-btn.on{background:#1b2733;border-color:#1b2733;color:#fff}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 2px}
.stat-card{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:9px 11px;box-shadow:var(--shadow-input)}
.stat-k{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8b97a3}
.stat-v{font-family:'Barlow Semi Condensed',sans-serif;font-size:21px;font-weight:800;color:#14181c;margin-top:1px;line-height:1.1}
.stat-s{font-size:11px;color:#5b6773;margin-top:2px}
.dl-card{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:10px;margin-top:6px}
.dl-row{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid #f1f2f4;font-size:13px}
.dl-row:first-child{border-top:none}
.dl-dot{flex:none;width:9px;height:9px;border-radius:50%;align-self:center}
.dl-room{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;flex:none;min-width:64px}
.dl-line{flex:1;color:#3d4854}
.dl-tag{flex:none;font-size:11px;font-weight:800;letter-spacing:.03em}
.mat-email-prev{border:1px solid var(--hairline);border-radius:8px;padding:10px;margin-top:8px;background:#fff;max-height:340px;overflow:auto;-webkit-overflow-scrolling:touch}
.toggle{display:inline-flex;align-items:center;gap:6px;font-family:'Barlow Semi Condensed',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--steel);cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

/* Sticky footer */
.footer-cta{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 12px;border-top:1px solid #cdd2d7;background:#eceef0;z-index:15}
.footer-cta .wrap-inner{max-width:760px;margin:0 auto;display:flex;gap:8px;width:100%}
/* persistent bottom nav — visible on every screen */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #cdd2d7;z-index:15;padding-bottom:env(safe-area-inset-bottom,0)}
.bottom-nav button{flex:1;background:none;border:none;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-family:'Barlow Semi Condensed',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;position:relative;padding:6px 2px}
.bottom-nav button.on{color:var(--accent)}
.bottom-nav svg{width:22px;height:22px;flex:none}
.bn-badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:9px;background:var(--error);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,24,28,.55);display:flex;justify-content:center;overflow-y:auto;padding:16px;z-index:40}
/* photo lightbox */
.lightbox{position:fixed;inset:0;background:rgba(12,15,18,.92);display:flex;align-items:center;justify-content:center;padding:12px;z-index:60}
.lightbox .lb-inner{position:relative;max-width:100%;max-height:100%;display:flex;flex-direction:column;align-items:center}
.lightbox img{max-width:100%;max-height:88vh;object-fit:contain;border-radius:var(--radius)}
.lightbox .lb-cap{color:#dfe4e9;font-size:12px;font-weight:600;margin-top:8px;text-align:center;max-width:90vw}
.lightbox .lb-close{position:fixed;top:12px;right:12px;width:44px;height:44px;border-radius:var(--radius);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center}
/* PDF drawing annotator */
.draw-ov{position:fixed;inset:0;background:#0c0f12;z-index:65;display:flex;flex-direction:column;touch-action:none;overscroll-behavior:none}
.draw-bar{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--navy);color:#fff;flex-wrap:wrap}
.draw-bar .db-title{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.03em;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.draw-btn{flex:none;background:#33465a;border:1px solid #435872;color:#fff;min-height:34px;padding:5px 10px;border-radius:var(--radius);font-family:'Barlow Semi Condensed',sans-serif;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.draw-btn.on{background:var(--accent);border-color:var(--accent)}
.draw-btn.go{background:var(--accent);border-color:var(--accent)}
.draw-btn.warn{background:#5a2f2f;border-color:#7a4444}
.draw-vp{flex:1;position:relative;overflow:hidden;touch-action:none;background:#0c0f12}
.draw-stage{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;touch-action:none}
.draw-stage img{display:block;pointer-events:none;-webkit-user-drag:none;user-select:none;touch-action:none}
.draw-stage svg{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;touch-action:none}
.draw-hint{flex:none;padding:6px 10px;background:#161b20;color:#cfd6dd;font-size:11.5px;text-align:center}
.draw-marker-hit{pointer-events:auto;cursor:pointer}
/* drawings list */
.dw-card{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:8px;margin-top:8px;box-shadow:var(--shadow-input);width:100%;text-align:left}
.dw-thumb{flex:none;width:54px;height:54px;border-radius:6px;border:1px solid var(--hairline);object-fit:cover;background:var(--bg)}
.dw-main{flex:1;min-width:0;display:flex;flex-direction:column}
.dw-name{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dw-sub{font-size:11px;color:var(--muted)}
.dw-mini{position:relative;display:inline-block;border:1px solid var(--hairline);border-radius:6px;overflow:hidden;background:var(--bg);margin-top:6px}
.dw-mini img{display:block;width:100%;height:auto}
.dw-mini svg{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible}
/* prominent back / breadcrumb bar */
.crumb-bar{display:flex;align-items:center;gap:8px;width:100%;background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow-input);font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--steel)}
.crumb-bar .cb-arrow{font-size:17px;font-weight:800;color:var(--accent);line-height:1}
.crumb-bar .cb-here{color:var(--muted);font-weight:600}
.crumb-bar:active{background:var(--bg)}
/* slide transitions between rooms list and a room */
@keyframes slideFwd{from{transform:translateX(26px);opacity:.35}to{transform:translateX(0);opacity:1}}
@keyframes slideBack{from{transform:translateX(-26px);opacity:.35}to{transform:translateX(0);opacity:1}}
.slide-fwd{animation:slideFwd .2s ease-out}
.slide-back{animation:slideBack .2s ease-out}
.modal{background:#fff;border-radius:var(--radius);max-width:340px;width:100%;padding:16px;text-align:center;margin:auto}
.modal h3{font-family:'Barlow Semi Condensed',sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px;font-size:16px}
.help-link{display:block;margin-top:12px;color:var(--accent);font-size:13px;font-weight:700;text-decoration:none}
.help-link:active{opacity:.7}
/* critical PDF export picker */
.cpdf-list{max-height:280px;overflow-y:auto;margin-top:8px;border:1px solid var(--hairline);border-radius:var(--radius)}
.cpdf-row{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid var(--hairline);text-align:left;cursor:pointer}
.cpdf-row:last-child{border-bottom:none}
.cpdf-row input{width:19px;height:19px;flex:none;margin-top:2px}
.cpdf-main{flex:1;min-width:0;font-size:13px;line-height:1.35}
.cpdf-txt{color:var(--muted);font-size:12px}
.cpdf-st{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--error);border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.cpdf-st.inprogress{background:var(--amber)}
.cpdf-st.done{background:var(--ok)}
/* critical comments + mentions */
.cmt{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:8px 10px;margin-top:6px;text-align:left}
.cmt-reply{margin-left:20px;background:var(--bg)}
.cmt-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px}
.cmt-head b{color:var(--steel)}
.cmt-when{margin-left:auto;font-size:10.5px;color:var(--muted)}
.cmt-text{font-size:13px;color:var(--ink);line-height:1.4;margin-top:2px;word-break:break-word}
.cmt-foot{display:flex;gap:14px;margin-top:4px}
.cmt-link{background:none;border:none;padding:0;color:var(--accent);font-size:11.5px;font-weight:700;cursor:pointer}
.cmt-link.cdanger{color:var(--error)}
.mention{color:#0d4f8b;font-weight:800}
.ctx-chip{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--steel);background:var(--bg);border:1px solid var(--hairline);border-radius:5px;padding:1px 6px}
.ctx-chip img{width:16px;height:16px;object-fit:cover;border-radius:3px;cursor:zoom-in}
.ctx-chip.fixc{color:var(--ok);border-color:#c9dcd0}
.ctx-bar{display:flex;align-items:center;gap:8px;background:#eef4f0;border:1px solid #c9dcd0;border-radius:6px;padding:5px 9px;margin-top:8px;font-size:12px;font-weight:600;color:var(--steel);text-align:left}
.m-chip{display:inline-flex;align-items:center;gap:3px;background:#e6eef7;border:1px solid #c3d6e8;color:#0d4f8b;border-radius:10px;padding:2px 4px 2px 8px;font-size:11px;font-weight:700}
.m-chip button{background:none;border:none;color:#0d4f8b;font-size:12px;padding:0 3px;cursor:pointer}
#mentionPick{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:8px;z-index:6;box-shadow:0 4px 12px rgba(20,24,28,.18);max-height:170px;overflow:auto}
.mp-item{display:block;width:100%;text-align:left;padding:9px 11px;border:none;border-bottom:1px solid var(--hairline);background:#fff;font-size:13px;font-weight:600;color:var(--ink)}
.mp-item:last-child{border-bottom:none}
.ph-cmt{position:absolute;bottom:3px;right:3px;display:inline-flex;align-items:center;gap:2px;min-width:22px;height:20px;border-radius:6px;background:rgba(20,24,28,.72);color:#fff;border:none;font-size:10px;font-weight:700;padding:0 5px}
.ment-wrap{background:#fff;border:1px solid #0d4f8b;border-left:4px solid #0d4f8b;border-radius:var(--radius);padding:10px 11px;margin:12px 0 4px;box-shadow:var(--shadow-input)}
/* material requests */
.mat-card{background:#fff;border:1px solid var(--hairline);border-left:3px solid var(--amber);border-radius:var(--radius);padding:9px 11px;margin-top:8px;box-shadow:var(--shadow-input);cursor:pointer}
.mat-card.inprogress{border-left-color:var(--accent)}
.mat-card.done{border-left-color:var(--steel);opacity:.82}
.mat-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px}
.mat-po{font-family:'Barlow Semi Condensed',sans-serif;font-weight:800;font-size:14px;letter-spacing:.02em}
.mat-st{flex:none;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--amber);border-radius:5px;padding:2px 7px}
.mat-st.inprogress{background:var(--accent)}
.mat-st.delivered{background:#1b2733}
.mat-st.done{background:var(--steel)}
.recv-wrap{overflow-x:auto;margin-top:6px;-webkit-overflow-scrolling:touch;border:1px solid #d4d4d4;border-radius:4px}
.recv-tab{border-collapse:collapse;width:100%;min-width:520px;background:#fff}
.recv-tab th,.recv-tab td{border:1px solid #d4d4d4;padding:4px 6px;font-size:12.5px;text-align:left;vertical-align:middle;background:#fff}
.recv-tab th{font-weight:700;font-size:11.5px;white-space:nowrap}
.recv-tab .rt-c{text-align:center}
.recv-tab .rt-num{font-weight:700}
.recv-tab tr.ok td{background:#f3f9f5}
.recv-tab tr.bad td{background:#fdf6f5}
.recv-tab .rt-item{min-width:140px;line-height:1.3}
.rt-ord{display:block;color:var(--muted);font-size:10.5px;white-space:nowrap}
.rt-ck{width:18px;height:18px;accent-color:var(--ok);vertical-align:middle}
.rt-qcell{white-space:nowrap}
.rt-qty{width:60px;padding:4px 5px;font-size:13px;min-height:0;display:inline-block;vertical-align:middle}
.rt-unit{font-size:10.5px;color:var(--muted);margin-left:3px}
.rt-ncell{min-width:150px}
.rt-note{width:100%;padding:4px 6px;font-size:12.5px;min-height:0}
.rt-cam{display:inline-flex;align-items:center;justify-content:center;width:29px;height:29px;border:1px solid var(--hairline);border-radius:6px;color:var(--steel);cursor:pointer;background:#fff}
.rt-cam.has{border-color:var(--accent);color:var(--accent)}
.mat-prev{font-size:12.5px;color:var(--ink);line-height:1.4}
.mat-by{font-size:11px;color:var(--muted);margin-top:3px}
.mat-item{display:flex;gap:9px;align-items:baseline;background:var(--bg);border:1px solid var(--hairline);border-radius:6px;padding:6px 9px;margin-top:5px;text-align:left}
.mi-qty{flex:none;min-width:34px;font-family:'Barlow Semi Condensed',sans-serif;font-weight:800;font-size:14px;color:var(--accent);text-align:right}
.mi-desc{flex:1;font-size:13px;color:var(--ink)}
.mi-ths{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.mi-th{width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--hairline);cursor:zoom-in}
.mip-btn{flex:none;display:flex;align-items:center;justify-content:center;min-width:40px;min-height:40px;background:#eef1f3;border:1px solid var(--line);border-radius:var(--radius);color:var(--steel);cursor:pointer}
.mip-btn.has{background:#eef7f1;border-color:var(--accent);color:var(--accent)}
.mat-del{flex:1;display:block;border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:9px 10px;font-size:13px;font-weight:700;color:var(--steel);text-align:left;cursor:pointer}
.mat-del.on{border-color:var(--accent);background:#eef7f1;color:var(--ink)}
.mat-del input{margin-right:6px;accent-color:var(--accent)}
.mat-del .md-sub{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:1px}
/* "assigned to you" dashboard section */
.mine-wrap{background:#fff;border:1px solid var(--error);border-left:4px solid var(--error);border-radius:var(--radius);padding:10px 11px;margin:12px 0 4px;box-shadow:var(--shadow-input)}
.mine-head{display:flex;align-items:center;gap:7px;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.03em;color:var(--error);border-bottom:1px solid #f0c9c4;padding-bottom:5px}
.mine-flag{font-size:15px;line-height:1}
/* room history feed + activity-log filters */
.hist-day{font-family:'Barlow Semi Condensed',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);border-bottom:1px solid var(--hairline);padding-bottom:3px;margin:14px 0 6px}
.hist-row{display:flex;gap:9px;align-items:flex-start;background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:8px 10px;margin-top:6px;box-shadow:var(--shadow-input)}
.hist-row .rc-dot{margin-top:4px;flex:none}
.hist-main{flex:1;min-width:0}
.hist-text{font-size:13px;color:var(--ink);line-height:1.35}
.hist-meta{font-size:11px;color:var(--muted);margin-top:2px}
.hist-meta b{color:var(--steel)}
.logf{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow-input)}
.logf .field{margin-bottom:6px}
.upbar{height:9px;background:var(--bg);border:1px solid var(--hairline);border-radius:6px;overflow:hidden;margin-top:7px}
.upbar .upfill{height:100%;width:0%;background:var(--accent);transition:width .25s}
.pw-wrap{position:relative}
.pw-wrap .in{padding-right:66px}
.pw-toggle{position:absolute;right:5px;top:5px;bottom:5px;background:#eef1f3;border:1px solid var(--line);border-radius:6px;color:var(--steel);font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:0 11px}
.pw-toggle:active{background:#e2e6e9}
.hint{font-size:11.5px;color:var(--muted);margin-top:6px;text-align:left;line-height:1.4}
.or-div{display:flex;align-items:center;gap:8px;margin:14px 0 8px;color:var(--muted)}
.or-div:before,.or-div:after{content:"";flex:1;height:1px;background:var(--hairline)}
.or-div span{font-family:'Barlow Semi Condensed',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.pick-row{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.pick-row .pr-name{font-weight:800}
.pick-row .pr-co{font-size:11px;color:var(--muted);font-weight:600}
.qr-box{display:flex;justify-content:center;padding:12px 0}
.qr-box canvas,.qr-box img{width:200px;height:200px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:13px}

/* Print — QR label sheet */
@media print{
  .app-header,.footer-cta,.no-print{display:none!important}
  .wrap{padding:0}
  body{background:#fff}
  .labels-sheet{display:grid!important;grid-template-columns:1fr 1fr;gap:0}
  .qr-label{break-inside:avoid;border:1px solid #000;padding:10px;text-align:center;margin:-0.5px}
}
.labels-sheet{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qr-label{border:1px solid var(--hairline);border-radius:var(--radius);padding:12px;text-align:center;background:#fff}
.qr-label .lnum{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:18px;text-transform:uppercase}
.qr-label .ljob{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.qr-label canvas,.qr-label img{width:150px;height:150px;margin:6px auto}
.qr-label .lscan{font-size:10px;color:var(--steel);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

/* Auth: user chip in header */
.user-chip{display:inline-flex;align-items:center;gap:6px;background:#233242;border:1px solid #33465a;color:#fff;border-radius:20px;padding:4px 10px 4px 6px;margin-top:6px;font-size:11px}
.user-chip .av{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;font-family:'Barlow Semi Condensed',sans-serif}
.user-chip .nm{font-weight:700}
.user-chip .co{color:#8fa1b3}

/* PIN entry */
.pin-in{width:100%;text-align:center;font-family:'Barlow Semi Condensed',sans-serif;font-size:34px;font-weight:700;letter-spacing:.4em;padding:12px 8px 12px 20px;border:1px solid var(--line);border-radius:var(--radius);color:var(--ink)}
.pin-in:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:-1px}
.modal.wide{max-width:560px;text-align:left}
.modal.wide h3{text-align:center}
.modal .msg{font-size:12px;font-weight:600;border-radius:var(--radius);padding:8px 10px;margin-top:8px}
.modal .msg.err{background:#fbeae8;color:var(--error)}
.modal .msg.ok{background:#e7f2ec;color:var(--ok)}
.modal .msg.warn{background:#fbf1e2;color:#9a5b12}

/* Login banner on room board */
.login-banner{display:flex;align-items:center;gap:10px;background:#fbf1e2;border:1px solid #eccf9a;border-radius:var(--radius);padding:9px 11px;margin-top:10px}
.login-banner .lb-txt{flex:1;font-size:12px;font-weight:600;color:#7a4d10}

/* Breadcrumbs */
.crumb{display:block;font-size:10.5px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;margin-top:2px}
.crumb .datebtn{background:#eef4f0;border:1px solid #c9dcd0;color:var(--accent);border-radius:5px;padding:1px 6px;font-size:10.5px;font-weight:700;cursor:pointer}
.crumb .who{color:var(--steel);font-weight:700}
.crumb .chk-stamp{color:var(--muted);font-weight:600;white-space:nowrap}
.chk.on .cname{text-decoration:none;color:var(--ink)}
.chk.on .cname .lead{text-decoration:line-through;color:var(--muted)}
.date-edit{display:inline-block;width:150px;min-height:30px;padding:4px 6px;font-size:12px;border:1px solid var(--accent);border-radius:5px}
.note .who{color:var(--steel);font-weight:700}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(20,24,28,.66);color:#fff;font-size:9px;font-weight:600;padding:2px 4px;line-height:1.2;border-bottom-left-radius:var(--radius);border-bottom-right-radius:var(--radius)}

/* Users panel (admin) */
.user-row{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:9px 10px;margin-top:6px}
.user-row.pending{border-color:#eccf9a;background:#fffaf1}
.user-row .u-main{flex:1;min-width:0}
.user-row .u-name{font-weight:700;font-size:13px}
.user-row .u-sub{font-size:11px;color:var(--muted)}
.user-row .u-pin{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;color:var(--steel);letter-spacing:.15em;font-size:13px}
.btn-approve{min-height:36px;padding:7px 12px;border-radius:var(--radius);background:var(--accent);border:1px solid var(--accent);color:#fff;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.req-banner{display:flex;align-items:center;gap:10px;background:#fffaf1;border:1px solid #eccf9a;border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.req-banner .rb-n{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:18px;color:#9a5b12}
.req-banner .grow{flex:1}
button.u-pin{cursor:pointer}
button.u-pin:active{color:var(--accent)}
.user-row{flex-wrap:wrap}
.role-btn{flex:none;min-height:34px;padding:6px 10px;border-radius:var(--radius);border:1px solid var(--line);background:#fff;color:var(--steel);font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.role-btn.on{background:#0d4f8b;border-color:#0d4f8b;color:#fff}
.role-badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.05em;color:#fff;background:#0d4f8b;border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:middle}

/* Room list (stacked, per-task % on its own line) */
.rooms-list{display:flex;flex-direction:column;gap:8px}
.room-card.wide{width:100%}
.rtop-right{display:flex;align-items:center;gap:6px}
.rt-lines{margin-top:8px;border-top:1px solid var(--hairline)}
.rt-line{display:flex;align-items:center;gap:8px;padding:5px 1px;border-bottom:1px solid var(--hairline);font-size:12px}
.rt-line:last-child{border-bottom:none}
.rt-name{flex:1;min-width:0;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-mini{width:60px;flex:none;height:5px;background:var(--bg);border:1px solid var(--hairline);border-radius:4px;overflow:hidden}
.rt-fill{display:block;height:100%;background:var(--accent)}
.rt-fill.done{background:var(--steel)}
.rt-pct{width:40px;flex:none;text-align:right;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;color:var(--steel);font-size:12px}

/* Recent activity feed */
.recent{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:4px 10px;margin-bottom:8px}
.recent .rc-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--hairline);font-size:12px}
.recent .rc-row:last-child{border-bottom:none}
.recent .rc-dot{width:8px;height:8px;flex:none;border-radius:50%;background:var(--accent)}
.recent .rc-main{flex:1;min-width:0}
.recent .rc-name{font-weight:600}
.recent .rc-sub{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent .rc-when{flex:none;color:var(--muted);font-size:11px;font-weight:600}
.recent .rc-room{flex:none;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:11px;color:#fff;background:var(--steel);border-radius:5px;padding:2px 6px}

/* Critical items on dashboard */
.crit-wrap{margin-bottom:10px}
.crit-item{background:#fff;border:1px solid var(--error);border-left:4px solid var(--error);border-radius:var(--radius);padding:10px;margin-top:8px}
.crit-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.crit-flag{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--error);border-radius:5px;padding:2px 7px}
.crit-room{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:11px;color:#fff;background:var(--steel);border-radius:5px;padding:2px 7px}
.crit-when{margin-left:auto;color:var(--muted);font-size:11px;font-weight:600}
.crit-text{font-size:13px;white-space:pre-wrap}
.crit-by{font-size:11px;color:var(--muted);font-weight:600;margin-top:3px}
.crit-reply{background:#eef4f0;border:1px solid #c9dcd0;border-radius:6px;padding:6px 8px;margin-top:6px;font-size:12px}
.crit-reply .who{color:var(--steel);font-weight:700}
.crit-wo{display:inline-block;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:#0d4f8b;border:1px solid #0d4f8b;border-radius:5px;padding:2px 7px;margin-top:6px}
.crit-item.done{border-color:var(--hairline);border-left-color:var(--ok);opacity:.75}
.crit-item.done .crit-flag{background:var(--ok)}
.crit-stage{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:var(--amber);border-radius:5px;padding:2px 7px}
.crit-manage{margin-top:8px}
.note .crit-tag{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:var(--error);border-radius:4px;padding:1px 5px;margin-right:5px}
.note .crit-tag.done{background:var(--ok)}
/* critical kanban board */
.kb-board{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.kb-col{min-width:0;background:#eef0f2;border:1px solid var(--hairline);border-radius:var(--radius);padding:6px;display:flex;flex-direction:column}
.kb-col.drop-hot{outline:2px solid var(--accent);outline-offset:-2px;background:#e6efe9}
.kb-head{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:1px 2px 6px}
.kb-title{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.kb-count{flex:none;background:#fff;border:1px solid var(--hairline);border-radius:10px;font-size:10px;font-weight:700;color:var(--muted);padding:0 6px;min-width:18px;text-align:center}
.lane-new .kb-title{color:var(--error)} .lane-prog .kb-title{color:var(--amber)} .lane-done .kb-title{color:var(--steel)}
.kb-cards{display:grid;grid-template-columns:1fr 1fr;gap:6px;min-height:44px;align-items:start}
.kb-empty{border:1px dashed #c2c9cf;border-radius:6px;color:var(--muted);font-size:9.5px;text-align:center;padding:12px 3px;grid-column:1/-1}
.kb-card{background:#fff;border:1px solid var(--hairline);border-left:3px solid var(--error);border-radius:6px;padding:5px 6px;box-shadow:var(--shadow-input);touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;min-width:0}
.kbc-stagechip{display:inline-block;margin-top:4px;font-size:8.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#1b2733;background:#e7edf3;border:1px solid #cfdae4;border-radius:8px;padding:1px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane-prog .kb-card{border-left-color:var(--amber)} .lane-done .kb-card{border-left-color:var(--steel)}
.kb-card.kb-ghost{opacity:.32}
.kbc-top{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:2px}
.kbc-room{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:11px;color:var(--ink);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbc-ph{flex:none;display:inline-flex;align-items:center;gap:1px;font-size:9px;font-weight:700;color:var(--steel);background:var(--bg);border:1px solid var(--hairline);border-radius:8px;padding:0 4px;white-space:nowrap}
.kbc-text{font-size:10.5px;line-height:1.28;color:var(--steel);word-break:break-word}
.kbc-meta{font-size:8.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.kbc-reply{font-size:9px;color:var(--accent);font-weight:700;margin-top:3px}
.kbc-assign{display:inline-flex;align-items:center;gap:4px;margin-top:5px;font-size:10px;font-weight:700;color:var(--steel);background:var(--bg);border:1px solid var(--hairline);border-radius:10px;padding:1px 7px 1px 2px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kbc-assign .kbc-av{flex:none;width:16px;height:16px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;font-family:'Barlow Semi Condensed',sans-serif}
.kbc-assign.unassigned{color:var(--muted);background:transparent;border-style:dashed;padding-left:7px}
/* critical scoreboard */
.score-wrap{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);box-shadow:var(--shadow-input);overflow:hidden}
.score-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-bottom:1px solid var(--hairline)}
.score-row:last-child{border-bottom:none}
.score-rank{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Semi Condensed',sans-serif;font-weight:800;font-size:12px;color:#fff;background:var(--steel)}
.score-rank.r1{background:#c9a227}.score-rank.r2{background:#8b97a3}.score-rank.r3{background:#b3703b}
.score-av{flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;font-family:'Barlow Semi Condensed',sans-serif}
.score-name{flex:1;min-width:0;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-stats{flex:none;font-size:11px;color:var(--muted);white-space:nowrap;font-weight:600}
.score-stats .sc-done{color:var(--ok);font-size:15px;font-weight:800}
.score-stats .sc-open{color:var(--amber);font-size:15px;font-weight:800}
.score-stats .sc-sep{margin:0 6px;color:var(--hairline)}
.score-unassigned{padding:7px 10px;font-size:11px;color:var(--muted);background:var(--bg);border-top:1px solid var(--hairline)}
/* admin dashboard */
.cat-row{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:9px 11px;margin-top:8px;box-shadow:var(--shadow-input)}
.cat-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.cat-name{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.02em}
.cat-pct{font-family:'Barlow Semi Condensed',sans-serif;font-weight:800;font-size:16px;color:var(--steel)}
.cat-row .pbar{margin-top:7px}
.cat-sub{font-size:11px;color:var(--muted);margin-top:5px}
.mo-task{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:9px 11px;margin-top:8px;box-shadow:var(--shadow-input)}
.mo-th{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mo-name{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.02em}
.mo-eta{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.mo-eta.done{color:var(--steel)}
.mo-sub{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 0 0;border-top:1px solid var(--hairline);margin-top:6px}
.mo-sub:first-of-type{margin-top:8px}
.mo-sname{flex:none;font-size:12.5px;font-weight:600;color:var(--ink)}
.mo-sline{flex:1;text-align:right;font-size:11.5px;color:var(--steel)}
.mo-sline .muted{color:var(--muted)}
.mo-ok{color:var(--ok);font-weight:700}
/* admin charts */
.chart-card{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:10px;margin-top:8px;box-shadow:var(--shadow-input)}
.chart-svg{display:block;width:100%;height:auto}
.chart-legend{display:flex;flex-wrap:wrap;gap:5px 13px;margin-top:8px}
.cl-item{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--steel)}
.cl-sw{width:10px;height:10px;border-radius:3px;flex:none;box-sizing:border-box}
/* room Critical tab list */
.rc-crit{background:#fff;border:1px solid var(--hairline);border-left:3px solid var(--error);border-radius:var(--radius);padding:9px 10px;margin-top:8px;box-shadow:var(--shadow-input);cursor:pointer}
.rc-crit.prog{border-left-color:var(--amber)} .rc-crit.done{border-left-color:var(--ok)}
.rcc-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px}
.rcc-lane{flex:none;font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--error);border-radius:5px;padding:2px 7px}
.rcc-lane.prog{background:var(--amber)} .rcc-lane.done{background:var(--ok)}
.rcc-asg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--steel);background:var(--bg);border:1px solid var(--hairline);border-radius:10px;padding:1px 8px 1px 2px}
.rcc-asg.un{color:var(--muted);background:transparent;border-style:dashed;padding-left:8px}
.rcc-av{flex:none;width:16px;height:16px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;font-family:'Barlow Semi Condensed',sans-serif}
.rcc-when{flex:none;margin-left:auto;font-size:10px;color:var(--muted)}
.rcc-text{font-size:13px;color:var(--ink);line-height:1.35}
.kb-drag-clone{position:fixed;z-index:70;pointer-events:none;box-shadow:0 6px 16px rgba(20,24,28,.3);opacity:.96;transform:rotate(1.5deg);cursor:grabbing}
.print-only{display:none}
@media print{ .print-only{display:block!important} }

/* Floor map */
.map-tools{display:flex;align-items:center;gap:6px;margin:8px 0}
.map-tools .map-zlabel{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:12px;color:var(--steel);min-width:44px;text-align:center}
.map-tools a.btn{display:inline-flex;align-items:center;text-decoration:none;margin-left:auto}
.map-scroll{border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:auto;-webkit-overflow-scrolling:touch;height:72vh}
.map-img{display:block;min-width:100%}
.map-miss{padding:24px 12px;text-align:center;color:var(--muted);font-size:13px}
.map-hint{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}

/* per-task attach (camera/note on each subtask row) */
.chk .attach-btn{flex:none;display:flex;align-items:center;gap:4px;min-height:34px;padding:5px 8px;margin-left:6px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--steel);font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:11px;cursor:pointer}
.chk .attach-btn.has{border-color:var(--accent);color:var(--accent)}
.chk .attach-btn svg{display:block}
.attach-existing{margin-top:10px}
.attach-note-item{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:8px 10px;margin-top:6px;font-size:13px}
.attach-note-item .meta{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-bottom:2px}
.task-badge{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--steel);background:var(--bg);border:1px solid var(--hairline);border-radius:4px;padding:1px 5px;margin-right:5px}

/* printable sheets (punch list + room sheet) */
.print-sheet{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:16px;color:#14181c}
.ps-head{border-bottom:2px solid #14181c;padding-bottom:8px;margin-bottom:10px}
.ps-title{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.ps-sub{font-size:12px;color:#5b6773;margin-top:2px}
.ps-section{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.05em;border-bottom:1px solid var(--hairline);margin:14px 0 6px;padding-bottom:2px}
.ps-room{margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--hairline)}
.ps-roomhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ps-roomnum{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:16px;text-transform:uppercase}
.ps-ada{font-size:10px;font-weight:700;border:1px solid #0d4f8b;color:#0d4f8b;border-radius:4px;padding:1px 5px}
.ps-pct{margin-left:auto;font-size:12px;color:#5b6773;font-weight:600}
.ps-task{margin:6px 0}
.ps-taskname{font-weight:700;font-size:13px;margin-bottom:2px}
.ps-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:2px 0}
.ps-box{width:14px;height:14px;flex:none;border:1.5px solid #14181c;border-radius:3px;position:relative}
.ps-box.on{background:#14181c}
.ps-box.on:after{content:"\2713";color:#fff;font-size:11px;position:absolute;left:1.5px;top:-2px}
.ps-by{color:#5b6773;font-size:11px}
.ps-photos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ps-photo img{width:100%;aspect-ratio:4/3;object-fit:cover;border:1px solid var(--hairline);border-radius:6px}
.ps-cap{font-size:10px;color:#5b6773;margin-top:2px}
.ps-note{font-size:13px;padding:5px 0;border-bottom:1px solid var(--hairline)}
.ps-crit{font-size:10px;font-weight:700;color:#fff;background:#c23b2e;border-radius:4px;padding:1px 5px}
.ps-crit.done{background:#2e7d4f}
.ps-tag{font-size:10px;font-weight:700;color:#3d4854;background:#f1efe8;border:1px solid var(--hairline);border-radius:4px;padding:1px 5px}
.ps-reply{color:#3d4854;font-size:12px;margin-top:2px}
.ps-sched{font-size:13px;margin-bottom:4px}
@media print{
  .app-header,.footer-cta,.no-print,.sheet-tools{display:none!important}
  .wrap{padding:0;max-width:100%}
  body{background:#fff}
  .print-sheet{border:none;border-radius:0;padding:0}
  .ps-room,.ps-note,.ps-photo,.ps-task{break-inside:avoid}
}

/* room list sizes */
.rooms-sm{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.rooms-md{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:520px){.rooms-md{grid-template-columns:1fr 1fr 1fr}}
.room-tile{background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:7px 6px;text-align:center;box-shadow:var(--shadow-input);position:relative}
.room-tile:active{border-color:var(--accent)}
.room-tile .tnum{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:14px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room-tile .tpct{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:12px;color:var(--steel)}
.room-tile .tbar{height:4px;background:var(--bg);border:1px solid var(--hairline);border-radius:3px;overflow:hidden;margin-top:3px}
.room-tile .tbar>span{display:block;height:100%;background:var(--accent)}
.room-tile .tbar>span.done{background:var(--steel)}
.room-tile .tada{position:absolute;top:3px;right:3px;font-size:7.5px;font-weight:800;color:#fff;background:#0d4f8b;border-radius:3px;padding:0 3px}
.ov-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px}
.ov-controls .lbl-mini{font-family:'Barlow Semi Condensed',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.btn-report{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:2px 0 12px;min-height:46px;border:1px solid #a83228;background:var(--error);color:#fff;border-radius:var(--radius);font-family:'Barlow Semi Condensed',sans-serif;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.04em;box-shadow:0 1.5px 3px rgba(194,59,46,.35)}
.btn-report:active{background:#a83228}
.btn-report .br-flag{font-size:17px;line-height:1}

/* project bar + projects screen */
.proj-bar{display:flex;align-items:center;gap:8px;width:100%;background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:8px 10px;margin-bottom:8px;cursor:pointer;text-align:left}
.proj-bar .pb-label{font-family:'Barlow Semi Condensed',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.proj-bar .pb-name{font-family:'Barlow Semi Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--ink);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-bar .pb-switch{flex:none;font-family:'Barlow Semi Condensed',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent)}
.proj-card{display:flex;align-items:center;gap:10px;width:100%;background:#fff;border:1px solid var(--hairline);border-radius:var(--radius);padding:11px;margin-top:8px;text-align:left;cursor:pointer;box-shadow:var(--shadow-input)}
.proj-card.on{border-color:var(--accent)}
.proj-card .pc-main{flex:1;min-width:0}
.proj-card .pc-name{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:16px}
.proj-card .pc-sub{font-size:11.5px;color:var(--muted)}
.proj-card .pc-pct{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;font-size:15px;color:var(--steel)}
.proj-card .pc-cur{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:var(--accent);border-radius:4px;padding:2px 6px;margin-left:6px}
</style>

<body>
<div id="app"></div>

<!-- Firebase (compat) + QR library -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="qrcode.min.js"></script>
<script src="pdf.min.js"></script>
<script src="jspdf.umd.min.js"></script>
<script>if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc="pdf.worker.min.js";}</script>
<script src="config.js"></script>
<script>
/* ============================================================
   El Dorado — Room Progress board
   Single-file app. RG & Sons Field UI style.
   ============================================================ */
"use strict";

var CFG = window.ED_CONFIG || {};
var DEFAULT_PID = "p_eldorado"; // the migrated original project; legacy rows (no projectId) belong here

/* ---------- tiny helpers ---------- */
function uid(p){ return (p||"id")+"_"+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function el(id){ return document.getElementById(id); }
function fmtDate(d){ if(!d) return ""; try{ var x=new Date(d+"T00:00:00"); return x.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }catch(e){ return d; } }
function clamp(n){ return Math.max(0,Math.min(100,n)); }

/* ---------- default task template (fully editable in Config) ---------- */
function defaultTemplate(){
  function t(name,subs){ return {id:uid("t"),name:name,subs:(subs||[]).map(function(s){return {id:uid("s"),name:s};})}; }
  return [
    t("Underground / DWV rough-in",["Waste & vent underground","Sanitary tie-in","Cleanouts set","Underground inspection"]),
    t("Water rough-in / top-out",["Hot & cold distribution","Isolation valves","Pressure test","Rough inspection"]),
    t("Fixture supports / carriers",["Wall carriers set","Backing / blocking"]),
    t("Trim-out / set fixtures",["Sinks & lavatories","Water closets","Faucets / flush valves","Stops & supplies"]),
    t("Test & final inspection",["Final pressure test","Final inspection sign-off"])
  ];
}

/* ============================================================
   STORE  — Firestore when available, else localStorage.
   Shape:
     config = { job:{name,number,address}, template:[{id,name,subs:[{id,name}]}] }
     room   = { id,number,ada,order,done:{},photos:[],notes:[],schedule:{start,target,items:[]} }
   ============================================================ */
var Store = {
  mode:"local", fb:null, db:null, storage:null,
  _config:null, _rooms:{}, _users:{}, _log:[], _projects:{}, _cbConfig:null, _cbRooms:null, _cbUsers:null, _cbLog:null, _cbProjects:null,

  online:true,
  init:function(){
    try{
      if(window.firebase && CFG.firebase && CFG.firebase.apiKey){
        this.fb = firebase.initializeApp(CFG.firebase);
        this.db = firebase.firestore();
        // offline persistence: edits made with no signal queue on the device and
        // upload automatically when the connection returns; reads serve from cache.
        try{ this.db.enablePersistence({synchronizeTabs:true}).catch(function(e){ console.warn("persistence not enabled:", e&&e.code); }); }
        catch(e){ console.warn("persistence threw", e); }
        try{ this.storage = firebase.storage(); }catch(e){ this.storage=null; }
        this.mode = "cloud";
      }
    }catch(e){ console.warn("Firebase init failed, using local mode:", e); this.mode="local"; }
    return this.mode;
  },

  /* subscribe */
  onConfig:function(cb){
    this._cbConfig = cb;
    if(this.mode==="cloud"){
      this.db.collection(CFG.configCollection).doc(CFG.configDoc)
        .onSnapshot(function(doc){
          Store._config = doc.exists ? doc.data() : null;
          cb(Store._config);
        }, function(err){ console.warn("config listen error (staying online, cache serves):",err&&err.code); });
    } else {
      this._config = this._lsGet("eldorado_config", null);
      cb(this._config);
    }
  },
  /* projects (each doc holds one project's config) */
  onProjects:function(cb){
    this._cbProjects = cb;
    if(this.mode==="cloud"){
      this.db.collection(CFG.projectsCollection)
        .onSnapshot(function(snap){
          var map={}; snap.forEach(function(d){ map[d.id]=d.data(); });
          Store._projects=map; cb(map);
        }, function(err){ console.warn("projects listen error (staying online):",err&&err.code); });
    } else {
      this._projects=this._lsGet("eldorado_projects_db",{}); cb(this._projects);
    }
  },
  saveProject:function(p){
    this._projects=this._projects||{}; this._projects[p.id]=p;
    if(this.mode==="cloud"){
      return this.db.collection(CFG.projectsCollection).doc(p.id).set(p).catch(function(e){ console.warn("saveProject failed",e); });
    } else {
      this._lsSet("eldorado_projects_db", this._projects);
      if(this._cbProjects) this._cbProjects(this._projects);
      return Promise.resolve();
    }
  },
  onRooms:function(cb){
    this._cbRooms = cb;
    if(this.mode==="cloud"){
      this.db.collection(CFG.roomsCollection)
        .onSnapshot({includeMetadataChanges:true}, function(snap){
          // fromCache === false means we're synced with the server (truly online)
          var was=Store.online; Store.online = !snap.metadata.fromCache;
          var map={}; snap.forEach(function(d){ map[d.id]=d.data(); });
          Store._rooms=map; cb(map);
          if(was!==Store.online) App.renderStatus();
        }, function(err){ console.warn("rooms listen error (staying online, cache serves):",err&&err.code); });
    } else {
      this._rooms = this._lsGet("eldorado_rooms", {});
      cb(this._rooms);
    }
  },
  _fallbackLocal:function(){
    if(this.mode==="local") return;
    this.mode="local";
    if(this._cbConfig) this._cbConfig(this._lsGet("eldorado_config",null));
    if(this._cbRooms) this._cbRooms(this._lsGet("eldorado_rooms",{}));
    if(this._cbUsers) this._cbUsers(this._lsGet("eldorado_users_db",{}));
    App.renderStatus();
  },

  /* writes */
  saveConfig:function(config){
    this._config = config;
    if(this.mode==="cloud"){
      return this.db.collection(CFG.configCollection).doc(CFG.configDoc).set(config)
        .catch(function(e){ console.warn("saveConfig failed",e); });
    } else {
      this._lsSet("eldorado_config", config);
      if(this._cbConfig) this._cbConfig(config);
      return Promise.resolve();
    }
  },
  saveRoom:function(room){
    this._rooms[room.id]=room;
    if(this.mode==="cloud"){
      return this.db.collection(CFG.roomsCollection).doc(room.id).set(room)
        .catch(function(e){ console.warn("saveRoom failed",e); });
    } else {
      this._lsSet("eldorado_rooms", this._rooms);
      if(this._cbRooms) this._cbRooms(this._rooms);
      return Promise.resolve();
    }
  },
  deleteRoom:function(id){
    delete this._rooms[id];
    if(this.mode==="cloud"){
      return this.db.collection(CFG.roomsCollection).doc(id).delete()
        .catch(function(e){ console.warn("deleteRoom failed",e); });
    } else {
      this._lsSet("eldorado_rooms", this._rooms);
      if(this._cbRooms) this._cbRooms(this._rooms);
      return Promise.resolve();
    }
  },
  /* users */
  onUsers:function(cb){
    this._cbUsers=cb;
    if(this.mode==="cloud"){
      this.db.collection(CFG.usersCollection)
        .onSnapshot(function(snap){
          var map={}; snap.forEach(function(d){ map[d.id]=d.data(); });
          Store._users=map; cb(map);
        }, function(err){ console.warn("users listen error (staying online, cache serves):",err&&err.code); });
    } else {
      this._users=this._lsGet("eldorado_users_db",{});
      cb(this._users);
    }
  },
  saveUser:function(u){
    this._users=this._users||{}; this._users[u.id]=u;
    if(this.mode==="cloud"){
      return this.db.collection(CFG.usersCollection).doc(u.id).set(u).catch(function(e){ console.warn("saveUser failed",e); });
    } else {
      this._lsSet("eldorado_users_db", this._users);
      if(this._cbUsers) this._cbUsers(this._users);
      return Promise.resolve();
    }
  },
  deleteUser:function(id){
    if(this._users) delete this._users[id];
    if(this.mode==="cloud"){
      return this.db.collection(CFG.usersCollection).doc(id).delete().catch(function(e){ console.warn("deleteUser failed",e); });
    } else {
      this._lsSet("eldorado_users_db", this._users);
      if(this._cbUsers) this._cbUsers(this._users);
      return Promise.resolve();
    }
  },
  /* material requests */
  onMaterials:function(cb){
    this._cbMats=cb;
    if(this.mode==="cloud"){
      this.db.collection(CFG.materialsCollection||"eldorado_materials")
        .onSnapshot(function(snap){
          var map={}; snap.forEach(function(d){ map[d.id]=d.data(); });
          Store._mats=map; cb(map);
        }, function(err){ console.warn("materials listen error (staying online, cache serves):",err&&err.code); });
    } else {
      this._mats=this._lsGet("eldorado_materials_db",{});
      cb(this._mats);
    }
  },

/* ============================================================
   PROGRESS MATH
   Each task = its subtasks (or 1 unit if no subtasks).
   Task % = done units / total units.  Room % = aggregate across all tasks.
   ============================================================ */
function taskUnits(task, room){
  var done=room && room.done ? room.done : {};
  if(task.subs && task.subs.length){
    var d=0; task.subs.forEach(function(s){ if(done[s.id]) d++; });
    return {done:d, total:task.subs.length};
  }
  return {done: done[task.id]?1:0, total:1};

function taskPct(task, room){ var u=taskUnits(task,room); return u.total? Math.round(u.done/u.total*100):0; }

  var d=0,t=0; (template||[]).forEach(function(task){ var u=taskUnits(task,room); d+=u.done; t+=u.total; });
  return {done:d,total:t};
}
function roomPct(template, room){ var u=roomUnits(template,room); return u.total? Math.round(u.done/u.total*100):0; }

/* ============================================================
   DRAWING ANNOTATION (red arrow + freehand outline) — SVG markup
   coords in loc are normalized 0..1; here converted to image pixels
   ============================================================ */
/* default arrow tail (normalized) when none has been positioned yet */
function arrowTail(loc){
  if(loc.tail) return loc.tail;
  var p=loc.point; var tx=p.x-0.13, ty=p.y-0.15;
  if(tx<0.03) tx=p.x+0.13; if(ty<0.03) ty=p.y+0.15;
  if(tx>0.97) tx=p.x-0.13; if(ty>0.97) ty=p.y-0.15;
  return {x:tx,y:ty};
}
function drawArrowAndOutline(page, loc){
  if(!loc) return "";
  var w=page.w, h=page.h, s=Math.max(w,h), out="";
  if(loc.outline && loc.outline.length>1){
    var d="M"+loc.outline.map(function(p){return (p.x*w).toFixed(1)+" "+(p.y*h).toFixed(1);}).join(" L");
    out+='<path d="'+d+'" fill="rgba(194,59,46,0.10)" stroke="#c23b2e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
  }
  if(loc.point){
    var tl=arrowTail(loc);
    var px=loc.point.x*w, py=loc.point.y*h, tx=tl.x*w, ty=tl.y*h;
    var ang=Math.atan2(py-ty,px-tx), ah=s*0.028;

    var a2x=px-ah*Math.cos(ang+0.42), a2y=py-ah*Math.sin(ang+0.42);
    out+='<line x1="'+tx.toFixed(1)+'" y1="'+ty.toFixed(1)+'" x2="'+px.toFixed(1)+'" y2="'+py.toFixed(1)+'" stroke="#c23b2e" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
    out+='<polygon points="'+px.toFixed(1)+","+py.toFixed(1)+" "+a1x.toFixed(1)+","+a1y.toFixed(1)+" "+a2x.toFixed(1)+","+a2y.toFixed(1)+'" fill="#c23b2e"/>';

  /* render a PDF File to page images {blob,w,h}; onProgress(i,total) */
  renderPdf:function(file, onProgress){

  /* ---- critical PDF export ---- */
  _pdfImg:function(url, maxPx){
    function shrink(img){
      try{
        var sc=Math.min(1,(maxPx||800)/Math.max(img.width,img.height));
        var c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        return {data:c.toDataURL("image/jpeg",0.8), w:c.width, h:c.height};
      }catch(e){ return null; }
    }
    function loadImg(src, cors){
      return new Promise(function(res){
        try{
          var img=new Image(); if(cors) img.crossOrigin="anonymous";
          var to=setTimeout(function(){ res(null); }, 15000);
          img.onload=function(){ clearTimeout(to); res(shrink(img)); };
          img.onerror=function(){ clearTimeout(to); res(null); };
          img.src=src;
        }catch(e){ res(null); }
      });
    }
    if(!url) return Promise.resolve(null);
    if(url.slice(0,5)==="data:" || url.slice(0,5)==="blob:") return loadImg(url,false);
    /* Cloud photo: fetch a fresh copy as a blob (sidesteps cached non-CORS
       responses poisoning the crossOrigin image load), then draw it. */
    return fetch(url, {mode:"cors", cache:"no-store"}).then(function(r){
      if(!r.ok) throw 0; return r.blob();
    }).then(function(b){
      var ou=URL.createObjectURL(b);
      return loadImg(ou,false).then(function(out){ try{URL.revokeObjectURL(ou);}catch(e){} return out; });
    }).catch(function(){
      /* Fallback: CORS image load with a cache-busting param, then bare URL. */
      var bust=url+(url.indexOf("?")>-1?"&":"?")+"pdfx="+Date.now();
      return loadImg(bust,true).then(function(out){ return out || loadImg(url,true); });
    });
  },
  /* render a critical's pinned plan location (cropped drawing + arrow/outline) as a JPEG for the PDF */
  _pdfLocImg:function(loc, maxPx){
    var d=this.drawingById(loc&&loc.drawingId); if(!d) return Promise.resolve(null);
    var pg=(d.pages||[])[loc.page||0]; if(!pg||!pg.url) return Promise.resolve(null);
    function load(src, cors){
      return new Promise(function(res){
        try{
          var img=new Image(); if(cors) img.crossOrigin="anonymous";
          var to=setTimeout(function(){ res(null); }, 15000);
          img.onload=function(){ clearTimeout(to); res(img); };
          img.onerror=function(){ clearTimeout(to); res(null); };
          img.src=src;
        }catch(e){ res(null); }
      });
    }
    var p;
    if(/^(data|blob):/.test(pg.url)) p=load(pg.url,false);
    else p=fetch(pg.url,{mode:"cors",cache:"no-store"}).then(function(r){ if(!r.ok) throw 0; return r.blob(); }).then(function(b){
        var ou=URL.createObjectURL(b);
        return load(ou,false).then(function(im){ try{URL.revokeObjectURL(ou);}catch(e){} return im; });
      }).catch(function(){ return load(pg.url+(pg.url.indexOf("?")>-1?"&":"?")+"pdfx="+Date.now(), true); });
    return p.then(function(img){
      if(!img) return null;
      try{
        var iw=img.width, ih=img.height;
        // gather every marked coordinate (incl. the arrow tail) to crop around
        var xs=[], ys=[];
        if(loc.point){ var tl=arrowTail(loc); xs.push(loc.point.x, tl.x); ys.push(loc.point.y, tl.y); }
        (loc.outline||[]).forEach(function(pt){ xs.push(pt.x); ys.push(pt.y); });

        if(xs.length){

          var winw=Math.max((maxx-minx)*2.1, iw*0.34), winh=Math.max((maxy-miny)*2.1, ih*0.34);
          winw=Math.min(winw,iw); winh=Math.min(winh,ih);
          cx0=Math.max(0, Math.min(iw-winw, (minx+maxx)/2-winw/2));
          cy0=Math.max(0, Math.min(ih-winh, (miny+maxy)/2-winh/2));
          cw=winw; ch=winh;
        }
        var sc=Math.min(1,(maxPx||1000)/Math.max(cw,ch));
        var c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(cw*sc)); c.height=Math.max(1,Math.round(ch*sc));

        g.drawImage(img, cx0, cy0, cw, ch, 0, 0, c.width, c.height);

        function py(ny){ return (ny*ih-cy0)*sc; }
        var cmax=Math.max(c.width,c.height);

        g.strokeStyle="#c23b2e"; g.fillStyle="#c23b2e"; g.lineWidth=lw; g.lineJoin="round"; g.lineCap="round";
        if(loc.outline && loc.outline.length>1){
          g.beginPath(); g.moveTo(px(loc.outline[0].x), py(loc.outline[0].y));

      }catch(e){ return null; }
    });
  },
  doCritPdf:function(ids, opts){
    var self=this; opts=opts||{};
    var withComments = opts.comments!==false;
    if(!window.jspdf || !window.jspdf.jsPDF){ this.toast("PDF engine didn't load — hard-refresh and try again"); return; }
    var items=this._critItems().filter(function(it){ return ids.indexOf(it.note.id)!==-1; });
    if(!items.length){ this.toast("Pick at least one issue"); return; }
    if(this.modal){ this.modal.busy=true; this.render(); }
    function stat(txt){ var s=el("cpdfStatus"); if(s) s.textContent=txt; }
    var doc=new window.jspdf.jsPDF({unit:"pt", format:"letter"});
    var W=612, MX=42, CW=W-MX*2, y=0;
    var aS=this.areaS(), aP=this.areaP(), job=this.projName();
    function newPage(first){ if(!first) doc.addPage(); y=46; }
    function need(h){ if(y+h>750){ doc.addPage(); y=46; } }
    function wrap(txt,size,color,bold,indent){
      doc.setFontSize(size); doc.setFont("helvetica", bold?"bold":"normal");
      doc.setTextColor(color[0],color[1],color[2]);
      var lines=doc.splitTextToSize(String(txt||""), CW-(indent||0));
      lines.forEach(function(ln){ need(size+4); doc.text(ln, MX+(indent||0), y); y+=size+3; });
    }
    newPage(true);
    doc.setFillColor(27,39,51); doc.rect(0,0,W,34,"F");
    doc.setTextColor(255,255,255); doc.setFontSize(13); doc.setFont("helvetica","bold");
    doc.text(job+" — Critical items", MX, 22);
    doc.setFontSize(9); doc.setFont("helvetica","normal");
    doc.text(new Date().toLocaleDateString()+" · "+items.length+" item"+(items.length===1?"":"s"), W-MX, 22, {align:"right"});
    y=52;
    var laneMeta={"new":{lab:"NEW",col:[194,59,46]},"inprogress":{lab:"IN PROGRESS",col:[232,132,44]},"done":{lab:"RESOLVED",col:[46,125,79]}};

    /* ---- page 1: at-a-glance summary by room ---- */
    var byRoom={}, rOrder=[];
    items.forEach(function(it){ var k=String(it.room); if(!byRoom[k]){ byRoom[k]=[]; rOrder.push(k); } byRoom[k].push(it); });
    rOrder.sort(function(a,b){ return a.localeCompare(b,undefined,{numeric:true}); });
    var cN=0,cP=0,cD=0;
    items.forEach(function(it){ var l=critLane(it.note); if(l==="done")cD++; else if(l==="inprogress")cP++; else cN++; });
    y+=8;

  /* copy rich HTML (with plain-text fallback) to the clipboard */
  _copyRich:function(html, text){
    return new Promise(function(res){
      function fallback(){
        try{
          var d=document.createElement("div");
          d.setAttribute("contenteditable","true");
          d.style.cssText="position:fixed;left:-9999px;top:0;opacity:0";
          d.innerHTML=html;
          document.body.appendChild(d);
          var range=document.createRange(); range.selectNodeContents(d);
          var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
          var ok=document.execCommand("copy");
          sel.removeAllRanges(); document.body.removeChild(d);
          res(!!ok);
        }catch(e){ res(false); }
      }
      try{
        if(navigator.clipboard && window.ClipboardItem){
          navigator.clipboard.write([new ClipboardItem({
            "text/html": new Blob([html],{type:"text/html"}),
            "text/plain": new Blob([text],{type:"text/plain"})
          })]).then(function(){ res(true); }, fallback);
        } else fallback();
      }catch(e){ fallback(); }
    });
  },

  /* per-room velocity/forecast vs its (optional) deadline */
  roomStats:function(){
    var tpl=this.template(); var rooms=this.roomList();
    var ids=[]; tpl.forEach(function(t){ if(t.subs&&t.subs.length){ t.subs.forEach(function(s){ids.push(s.id);}); } else ids.push(t.id); });
    var total=ids.length;
    var today=new Date(); today.setHours(12,0,0,0);
    var list=rooms.map(function(r){
      var done=0, dates=[], first=null, last=null;
      ids.forEach(function(id){ var v=r.done&&r.done[id]; if(!v) return; done++;
        var dt=(v!==true&&v.date)?v.date:((v!==true&&v.ts)?tsYMD(v.ts):null); if(dt){ dates.push(dt); if(!first||dt<first)first=dt; if(!last||dt>last)last=dt; } });
      var days={}; dates.forEach(function(d){days[d]=1;}); var activeDays=Object.keys(days).length;
      var rate=activeDays? dates.length/activeDays : 0;
      var remaining=total-done;
      var daysLeft=(rate>0&&remaining>0)?Math.ceil(remaining/rate):(remaining<=0?0:null);
      var fin=(remaining>0&&daysLeft!=null)?estFinishDate(daysLeft):null;
      var dl=ymdD(r.deadline);
      var status;
      if(total&&remaining<=0) status="done";
      else if(dl&&dl<today) status="overdue";
      else if(dl&&fin) status=(fin<=dl)?"ontrack":"risk";
      else if(dl) status="watch";
      else status="nodl";
      return {id:r.id, number:r.number, pct:(total?Math.round(done/total*100):0), done:done, total:total, remaining:remaining,
        rate:rate, daysLeft:daysLeft, fin:fin, dl:dl, dlYMD:r.deadline||"", first:first?ymdD(first):null, last:last?ymdD(last):null, status:status};
    });
    return {total:total, list:list};
  },
  _roomSorted:function(rs){
    var mode=this.roomSort||"risk";
    var arr=rs.list.slice();
    function numCmp(a,b){ return String(a.number).localeCompare(String(b.number),undefined,{numeric:true}); }
    if(mode==="number"){ arr.sort(numCmp); }
    else if(mode==="deadline"){
      arr.sort(function(a,b){ if(!!a.dl!==!!b.dl) return a.dl?-1:1; if(a.dl&&b.dl&&(a.dl-b.dl)) return a.dl-b.dl; return numCmp(a,b); });
    } else {
      var ord={overdue:0,risk:1,watch:2,ontrack:3,nodl:4,done:5};
      arr.sort(function(a,b){ var dd=ord[a.status]-ord[b.status]; if(dd) return dd;
        if(a.dl&&b.dl&&(a.dl-b.dl)) return a.dl-b.dl;
        return numCmp(a,b); });
    }
    return arr;
  },
  /* second gantt: one row per room, sorted; each room's own velocity vs its deadline */
  _chartRoomGantt:function(rs, zoom){
    var DAY=86400000; var today=new Date(); today.setHours(12,0,0,0);
    function addD(dt,n){ return new Date(dt.getTime()+n*DAY); }
    var rows=this._roomSorted(rs).map(function(r){
      var row={label:String(r.number).slice(0,9), labelSub:r.pct+'%', dl:r.dl};
      if(r.status==="done"){ row.type="done"; row.a=r.first||today; row.b=r.last||today; }
      else if(r.daysLeft!=null&&r.fin){ row.type="active"; row.a=r.first||today; row.b=today; row.fin=r.fin; row.miss=(r.status==="risk"||r.status==="overdue"); }
      else { row.type="nopace"; row.a=today; row.b=addD(today,7); row.miss=(r.status==="overdue"); }
      return row;
    });
    if(!rows.length) return "";
    return this._ganttSvg(rows,{x0:64, aria:this.areaS()+" schedule forecast", zoom:zoom});

  /* headline forecast numbers shared by the dashboard tiles and the email report */
  _forecastStats:function(st, rs){
    var byDay=this._dailyCompletions();
    var td=new Date(); td.setHours(12,0,0,0);
    function ymdOff(n){ return tsYMD(td.getTime()-n*86400000); }
    var last7=0, prev7=0, act14=0, sum14=0;
    for(var i7=0;i7<7;i7++){ last7+=byDay[ymdOff(i7)]||0; }
    for(var p7=7;p7<14;p7++){ prev7+=byDay[ymdOff(p7)]||0; }
    for(var a14=0;a14<14;a14++){ var c14=byDay[ymdOff(a14)]||0; if(c14){ act14++; sum14+=c14; } }
    var rate14=act14?sum14/act14:0;
    var overallDone=0, overallTotal=0; st.tasks.forEach(function(t){ overallDone+=t.doneUnits; overallTotal+=t.totalUnits; });
    var remainAll=overallTotal-overallDone;
    var projD=(rate14>0&&remainAll>0)?estFinishDate(Math.ceil(remainAll/rate14)):null;
    var taskRisk=0; st.tasks.forEach(function(t){ var tdl=ymdD(t.deadline); if(!tdl||t.remainingUnits<=0) return;
      var tfin=(t.daysLeft!=null)?estFinishDate(t.daysLeft):null;
      if(tdl<td || (tfin&&tfin>tdl)) taskRisk++; });
    var roomRisk=rs.list.filter(function(r){ return r.status==="overdue"||r.status==="risk"; }).length;
    return { overallDone:overallDone, overallTotal:overallTotal, overallPct:(overallTotal?Math.round(overallDone/overallTotal*100):0),
      last7:last7, prev7:prev7, wkDelta:last7-prev7, act14:act14, rate14:rate14, remainAll:remainAll, projD:projD,
      taskRisk:taskRisk, roomRisk:roomRisk, today:td };
  },
  /* rasterize a chart's SVG markup into a PNG data URL (for pasting into emails) */
  _svgToPng:function(chartHtml, scale){
    return new Promise(function(res){
      try{
        var mm=/<svg[\s\S]*?<\/svg>/.exec(chartHtml||""); if(!mm){ res(null); return; }
        var svg=mm[0];
        var vb=/viewBox="0 0 ([\d.]+) ([\d.]+)"/.exec(svg);
        var w=vb?parseFloat(vb[1]):360, h=vb?parseFloat(vb[2]):200;
        svg=svg.replace('<svg ','<svg width="'+w+'" height="'+h+'" ');
        var img=new Image();
        img.onload=function(){
          try{
            var sc=scale||2, c=document.createElement("canvas");
            c.width=Math.round(w*sc); c.height=Math.round(h*sc);
            var ctx=c.getContext("2d"); ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,c.width,c.height);
            ctx.scale(sc,sc); ctx.drawImage(img,0,0,w,h);
            res(c.toDataURL("image/png"));
          }catch(e){ res(null); }
        };
        img.onerror=function(){ res(null); };
        img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
      }catch(e){ res(null); }
    });
  },
